<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Amed Cafe loyalty rewards: check your drink and shisha stamps.">
<meta property="og:title" content="Amed Cafe Rewards">
<meta property="og:description" content="Buy 7, and the 8th is on us. Check your loyalty card.">
<meta property="og:image" content="icon-512.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Amed Cafe">
<meta name="theme-color" content="#1F4B3A">
<title>Amed Cafe Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap">
<style>
/* Layout: one column for a phone in the hand — brand + language, "check your card", the result, then how it works. */
:root {
  --logo-filter: none;
  --bg: #EDF0EB;
  --surface: #FFFFFF;
  --ink: #1C231E;
  --muted: #5B675E;
  --line: #D3DAD2;
  --accent: #1F5C45;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEAE2;
  --card: #1F4B3A;
  --card-ink: #F3EFE6;
  --card-dim: rgba(243,239,230,.28);
  --stamp: #D9A15B;
  --stamp-ink: #3A2412;
  --danger: #A3342C;
  --f-display: "Gloock", "Georgia", "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --surface: #1A201C; --ink: #E6EBE5; --muted: #98A59B; --line: #2C3530;
    --accent: #62B48E; --accent-ink: #0C1912; --accent-soft: #1F3329;
    --card: #1C3A2E; --card-ink: #F1ECE1; --card-dim: rgba(241,236,225,.22);
    --stamp: #E0AC69; --stamp-ink: #2E1C0E; --danger: #E3786E; --logo-filter: invert(1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --surface: #1A201C; --ink: #E6EBE5; --muted: #98A59B; --line: #2C3530;
  --accent: #62B48E; --accent-ink: #0C1912; --accent-soft: #1F3329;
  --card: #1C3A2E; --card-ink: #F1ECE1; --card-dim: rgba(241,236,225,.22);
  --stamp: #E0AC69; --stamp-ink: #2E1C0E; --danger: #E3786E; --logo-filter: invert(1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body.rtl { --f-body: "Noto Sans Arabic", system-ui, sans-serif; --f-display: "Noto Sans Arabic", serif; }
body.rtl .hero h1, body.rtl .card h2, body.rtl .check .ttl, body.rtl .notfound h2, body.rtl .offer h4 { font-weight: 800; letter-spacing: 0; }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 26px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand .logo { width: min(220px, 56vw); height: auto; display: block; filter: var(--logo-filter); }
.langs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
.langs button { border: 0; background: none; border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: .85rem; cursor: pointer; min-height: 36px; font-family: "Figtree", "Noto Sans Arabic", sans-serif; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.langs button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 7px; transition: background .15s; }
.langs button:hover:not([aria-pressed="true"]) { background: var(--accent-soft); }
.langs .flag { width: 27px; height: 18px; border-radius: 3px; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.15); display: block; }
.langs button[aria-pressed="true"] .flag { box-shadow: 0 0 0 2px var(--bg); }
@media (max-width: 420px) { .langs button span { display: none; } .langs button { padding: 7px 10px; } .langs .flag { width: 33px; height: 22px; } }

.hero .tag { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; margin: 0 0 8px; }
body.rtl .hero .tag { letter-spacing: 0; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.1rem, 9vw, 3.1rem); line-height: 1.08; margin: 0 0 10px; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--stamp); }
.hero p { margin: 0; color: var(--muted); max-width: 46ch; }

.check { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; }
.check .ttl { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; }
.check label { font-weight: 600; font-size: .85rem; color: var(--muted); margin-bottom: -4px; }
.check input { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 1.15rem; font-family: var(--f-mono); letter-spacing: .03em; min-height: 52px; width: 100%; min-width: 0; direction: ltr; text-align: start; }
body.rtl .check input { text-align: right; }
.check input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.check .row { display: flex; gap: 8px; }
.check .row input { flex: 1; }
.check button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 0 18px; font-weight: 700; min-height: 52px; cursor: pointer; }
.check button:hover { filter: brightness(1.08); }
.check small { color: var(--muted); font-size: .84rem; }
.err { color: var(--danger); margin: 0; font-size: .92rem; }

.result { display: grid; gap: 14px; }
.result .hello { font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; margin: 0; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
.summary .facts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.summary .facts div { display: grid; min-width: 0; }
.summary .facts span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
body.rtl .summary .facts span { letter-spacing: 0; }
.summary .facts b { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
body.rtl .summary .facts b { font-weight: 700; }
.vip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vip .badge { background: var(--ink); color: var(--bg); font-weight: 800; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; padding: 4px 12px; border-radius: 99px; }
.meter { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.vip small { color: var(--muted); }

.card { background: var(--card); color: var(--card-ink); border-radius: 18px; padding: 20px; position: relative; overflow: hidden; }
.card::after { content: ""; position: absolute; right: -50px; top: -50px; width: 170px; height: 170px; border-radius: 50%; border: 12px solid var(--card-dim); opacity: .35; pointer-events: none; }
.card .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; position: relative; z-index: 1; }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; margin: 0; }
.card .rule { font-size: .74rem; opacity: .8; font-weight: 600; text-align: end; }
.stamps { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin: 16px auto 14px; max-width: 340px; position: relative; z-index: 1; direction: ltr; }
.slot { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 2px dashed var(--card-dim); display: grid; place-items: center; font-family: var(--f-mono); font-size: .78rem; color: var(--card-dim); }
.slot.on { border: 0; background: var(--stamp); color: var(--stamp-ink); }
.slot.on svg { width: 56%; height: 56%; }
.slot.reward { border-style: solid; border-color: var(--stamp); color: var(--stamp); font-family: var(--f-body); font-weight: 800; font-size: .7rem; text-align: center; }
.slot.reward.lit { background: var(--card-ink); color: var(--card); border-color: var(--card-ink); }
.card .line { position: relative; z-index: 1; }
.card .line strong { font-size: 1.15rem; }
.ready { display: block; margin-top: 10px; background: var(--stamp); color: var(--stamp-ink); font-weight: 700; padding: 10px 12px; border-radius: 12px; position: relative; z-index: 1; }
.card .tally { display: flex; gap: 18px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--card-dim); position: relative; z-index: 1; font-size: .85rem; }
.card .tally b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.4rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.myqr { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.myqr .qr { background: #fff; padding: 8px; border-radius: 10px; width: 136px; height: 136px; flex: none; }
.myqr .qr img, .myqr .qr canvas { width: 120px !important; height: 120px !important; display: block; }
.myqr div.txt { flex: 1 1 180px; min-width: 0; }
.myqr b { display: block; font-size: 1.05rem; }
.myqr code { font-family: var(--f-mono); font-size: 1.2rem; letter-spacing: .12em; }
.myqr p { margin: 4px 0 0; color: var(--muted); font-size: .88rem; }
.updated { color: var(--muted); font-size: .8rem; margin: 0; }
.again { justify-self: start; border: 0; background: none; color: var(--accent); font-weight: 700; padding: 4px 0; cursor: pointer; }

.notfound { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.notfound h2 { font-family: var(--f-display); font-weight: 400; margin: 0 0 6px; font-size: 1.35rem; }
.notfound p { margin: 0; color: var(--muted); }

section h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 12px; }
body.rtl section h3 { letter-spacing: 0; font-size: .9rem; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.steps li { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 12px; align-items: start; }
.steps .n { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.2rem; }
.steps b { display: block; }
.steps span { color: var(--muted); font-size: .94rem; }
.offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.offer { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.offer .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.offer h4 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; }
.offer .eq { font-weight: 700; color: var(--accent); font-size: .9rem; white-space: nowrap; }
.strip { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; direction: ltr; }
.strip i { width: 22px; height: 22px; border-radius: 50%; background: var(--stamp); color: var(--stamp-ink); display: grid; place-items: center; }
.strip i svg { width: 14px; height: 14px; }
.strip .plus { color: var(--muted); font-weight: 700; padding: 0 2px; }
.strip .free { width: auto; padding: 0 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-style: normal; font-size: .68rem; font-weight: 800; letter-spacing: .06em; height: 22px; display: inline-grid; place-items: center; }
.offer p { margin: 0; color: var(--muted); font-size: .9rem; }
.levels { display: grid; gap: 8px; }
.levels div { display: flex; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; flex-wrap: wrap; }
.levels b { font-weight: 800; }
.levels span { color: var(--muted); font-size: .9rem; }
.evts { display: grid; gap: 10px; }
.evt { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 12px; align-items: start; }
.evt .when { background: var(--accent); color: var(--accent-ink); border-radius: 10px; text-align: center; padding: 6px 4px; font-weight: 800; line-height: 1.1; }
.evt .when small { display: block; font-size: .68rem; font-weight: 700; opacity: .85; }
.evt .when.offer { background: var(--stamp); color: var(--stamp-ink); font-size: 1.1rem; display: grid; place-items: center; min-height: 52px; }
.evt b { display: block; }
.evt span { color: var(--muted); font-size: .9rem; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.rules li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: .94rem; }
.share { justify-self: start; border: 0; background: linear-gradient(90deg, #833AB4, #E1306C 60%, #F77737); color: #fff; border-radius: 12px; padding: 12px 18px; font-weight: 800; cursor: pointer; min-height: 48px; }
.linkbtn { color: var(--accent); font-weight: 700; font-size: .9rem; text-decoration: none; justify-self: start; }
.linkbtn:hover { text-decoration: underline; }
.wabtn { display: inline-flex; margin-top: 8px; background: #1F8A4C; color: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 700; text-decoration: none; font-size: .92rem; }
.install { display: grid; gap: 6px; justify-items: start; }
.installbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
.install small { color: var(--muted); }
/* Loyalty card (B + C): colours come from the member's level via --lc-* */
.lc { position: relative; overflow: hidden; border-radius: 26px; background: var(--lc-bg); color: var(--lc-text); padding: 22px 20px 18px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.lc > * { position: relative; }
.lc-sun { position: absolute !important; width: 420px; height: 420px; inset-inline-end: -150px; top: 300px; opacity: .045; pointer-events: none; }
.lc-light .lc-sun { opacity: .05; }
.lc-frame { position: absolute !important; inset: 9px; border: 1px solid #B8C0C8; border-radius: 19px; pointer-events: none; }
.lc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.lc-logo { width: 118px; height: auto; display: block; }
.lc-badge { border: 1px solid var(--lc-accent); color: var(--lc-accent); border-radius: 999px; padding: 5px 11px; font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
body.rtl .lc-badge { letter-spacing: 0; font-size: .78rem; }
.lc-greet { display: grid; gap: 2px; }
.lc-hi { color: var(--lc-muted); font-size: .95rem; }
.lc-h { font-family: var(--f-display); font-size: 2.6rem; line-height: 1.05; }
body.rtl .lc-h { font-weight: 800; font-size: 2.3rem; }
.lc-acc { color: var(--lc-accent); }
.lc-until { color: var(--lc-soft); font-size: .95rem; }
.lc-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.lc-tabs:empty { display: none; }
.lc-tab { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--lc-border); background: transparent; color: var(--lc-text); font: inherit; font-weight: 600; cursor: pointer; }
.lc-tab[aria-pressed="true"] { background: var(--lc-accent); border-color: var(--lc-accent); color: var(--lc-on); font-weight: 700; }
.lc-hero { display: flex; align-items: flex-end; justify-content: center; gap: 16px; min-height: 300px; }
.lc-rail { position: relative; display: flex; flex-direction: column-reverse; justify-content: space-between; align-items: center; width: 42px; height: 300px; flex: none; }
.lc-rail::before, .lc-rail::after { content: ""; position: absolute; left: 20px; width: 2px; bottom: 14px; }
.lc-rail::before { top: 22px; background: var(--lc-rail); }
.lc-rail::after { height: var(--fill); background: var(--lc-accent); }
.lc-node { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; box-sizing: border-box; border: 2px solid var(--lc-border); background: var(--lc-bg); color: var(--lc-dim); display: grid; place-items: center; font: 600 12px var(--f-mono); }
.lc-node.on { background: var(--lc-accent); border-color: var(--lc-accent); color: var(--lc-on); font-weight: 700; }
.lc-free { position: relative; z-index: 1; width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--lc-accent); background: var(--lc-bg); color: var(--lc-accent); display: grid; place-items: center; font: 800 9px "Figtree", sans-serif; letter-spacing: .06em; box-shadow: 0 0 0 6px rgba(var(--lc-glow), .12), 0 0 26px rgba(var(--lc-glow), .4); box-sizing: border-box; }
.lc-free.lit { background: var(--lc-accent); color: var(--lc-on); }
.lc-art { display: flex; align-items: center; gap: 12px; min-width: 0; }
.lc-art .cup { width: min(236px, 58vw); height: auto; display: block; }
.lc-photo { height: 300px; width: auto; max-width: 100%; display: block; }
.lc-num { font-family: "Gloock", Georgia, serif; font-size: 3rem; line-height: 1; color: var(--lc-accent); white-space: nowrap; }
.lc-ready { background: var(--lc-accent); color: var(--lc-on); font-weight: 700; padding: 11px 13px; border-radius: 13px; }
.lc-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.lc-stats div { display: grid; min-width: 0; }
.lc-stats b { font-family: "Gloock", Georgia, serif; font-weight: 400; font-size: 1.5rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.lc-stats span { font-size: .78rem; color: var(--lc-muted); }
.lc-next { margin: 0; font-size: .86rem; color: var(--lc-soft); }
.lc-qr { display: flex; align-items: center; gap: 14px; border: 1px solid var(--lc-border); border-radius: 18px; padding: 12px 14px; background: var(--lc-panel); }
.lc-qrimg { background: #fff; border-radius: 10px; padding: 4px; flex: none; }
.lc-qrimg img, .lc-qrimg canvas { width: 76px !important; height: 76px !important; display: block; }
.lc-qrtxt { display: grid; gap: 3px; min-width: 0; }
.lc-qrtxt span { font-size: .84rem; color: var(--lc-soft); }
.lc-qrtxt small { font-size: .76rem; color: var(--lc-muted); }
.lc-code { font: 600 1.2rem var(--f-mono) !important; letter-spacing: .16em; color: var(--lc-accent) !important; text-align: start; }
@media (max-width: 370px) { .lc-photo { height: 250px; } .lc-hero { min-height: 260px; } .lc-rail { height: 260px; } .lc-h { font-size: 2.2rem; } }

.ver { font-size: .7rem; opacity: .6; }
body { transition: background-color .35s ease, color .35s ease; }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
body[data-level] .lc { border: 1px solid var(--line); }
.welcome { display: grid; gap: 4px; }
.welcome h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(1.9rem, 8vw, 2.4rem); line-height: 1.1; text-wrap: balance; }
body.rtl .welcome h2 { font-weight: 800; }
.welcome p { margin: 0; color: var(--muted); }
.signout { justify-self: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 22px; font: inherit; font-weight: 700; cursor: pointer; min-height: 44px; }
footer { color: var(--muted); font-size: .82rem; border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 6px; }
footer p { margin: 0; }
</style>
</head>
<body>
<main id="app">
  <header class="brand">

    r.append(el("button", { type: "button", class: "share", text: tr("shareBtn"), onclick: () => shareImage(entry) }));
    r.append(el("button", { type: "button", class: "signout", text: tr("signOut"), onclick: signOut }));
    if (scroll) window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  // Signed in: the whole page takes the member's level style (colours, logo, panels); Sign out restores the normal page.
  const PAGE_BG = { member: "#120E0C", silver: "#0F1216", gold: "#0F1214", platinum: "#E2E6EA" };
  const PAGE_VARS = ["--bg", "--surface", "--ink", "--muted", "--line", "--accent", "--accent-ink", "--accent-soft", "--stamp", "--stamp-ink", "--card", "--card-ink", "--card-dim", "--logo-filter"];
  function applyPageTheme(tier) {
    const th = THEMES[tier], st = document.documentElement.style;
    const v = { "--bg": PAGE_BG[tier], "--surface": th.panel, "--ink": th.text, "--muted": tier === "platinum" ? "#4C545D" : th.muted, "--line": th.border, "--accent": th.accent, "--accent-ink": th.on,
      "--accent-soft": "rgba(" + th.glow + ",.16)", "--stamp": th.accent, "--stamp-ink": th.on, "--card": th.bg, "--card-ink": th.text, "--card-dim": "rgba(" + th.glow + ",.3)", "--logo-filter": "none" };
    for (const [k, val] of Object.entries(v)) st.setProperty(k, val);
    st.colorScheme = tier === "platinum" ? "light" : "dark";
    document.body.dataset.level = tier;
    const logo = document.querySelector(".brand .logo"); if (logo) logo.src = th.logo;
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = PAGE_BG[tier];
  }
  function clearPageTheme() {
    const st = document.documentElement.style; for (const k of PAGE_VARS) st.removeProperty(k); st.colorScheme = "";
    delete document.body.dataset.level;
    const logo = document.querySelector(".brand .logo"); if (logo) logo.src = "logo.png";
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = "#1F4B3A";
  }
  // Signed in: hide the sign-in parts; the phone remembers the card (not the PIN) until Sign out.
  function setSignedIn(on) { for (const id of ["heroBox", "checkForm", "howSec", "cardsSec"]) $(id).hidden = on; }
  function signOut() {
    try { localStorage.removeItem("amed-session"); } catch (_) {}
    lastEntry = null; activeProg = null; $("result").hidden = true; $("result").textContent = "";
    $("phone").value = ""; $("pin").value = ""; setSignedIn(false); clearPageTheme(); window.scrollTo({ top: 0 });
  }

  // Instagram-ready image (1080×1350) of the customer's card, shared or saved from the browser.
  let logoImg = null;
  const loadLogo = () => logoImg ? Promise.resolve(logoImg) : new Promise((res) => { const i = new Image(); i.onload = () => { logoImg = i; res(i); }; i.onerror = () => res(null); i.src = "logo.png"; });
  function wrapText(ctx, text, x, y, maxW, lh) {
    const words = text.split(" "); let line = "", lines = [];
    for (const w of words) { const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
    lines.push(line); lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh)); return lines.length * lh;
  }
  async function shareImage(entry) {
    const th = THEMES[levelInfo(entry.v || 0).tier], W = 1080, H = 1350, cv = document.createElement("canvas"); cv.width = W; cv.height = H; const ctx = cv.getContext("2d");
    try { await document.fonts.ready; } catch (_) {}
    const rtl = lang !== "en", font = rtl ? '"Noto Sans Arabic"' : '"Gloock", Georgia, serif', body = rtl ? '"Noto Sans Arabic"' : '"Figtree", sans-serif';
    ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(" + th.glow + ",.14)"; ctx.lineWidth = 60; ctx.beginPath(); ctx.arc(W - 40, 80, 260, 0, Math.PI * 2); ctx.stroke();
    const logo = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = th.logo; });
    if (logo) { const lw = 560, lh = lw * logo.height / logo.width; ctx.drawImage(logo, (W - lw) / 2, 110, lw, lh); }
    const progs = DATA.programs.filter((q) => entry.p && entry.p[q.id]);
    const p = progs.find((q) => entry.p[q.id][1] > 0) || progs.slice().sort((a, b) => entry.p[b.id][0] / b.target - entry.p[a.id][0] / a.target)[0];
    const [stamps, rewards] = entry.p[p.id], s = Math.min(stamps, p.target);
    ctx.direction = rtl ? "rtl" : "ltr"; ctx.textAlign = "center"; ctx.fillStyle = th.text;
    ctx.font = (rtl ? "800 " : "400 ") + "78px " + font;
    const head = rewards > 0 ? tr("shareReady", { reward: preward(p) }) : tr("shareProgress", { s, n: p.target });
    const used = wrapText(ctx, head, W / 2, 520, 900, 96);
    const n = p.target + 1, cols = n <= 6 ? n : n % 4 === 0 ? 4 : 5, r = 62, gap = 34, gw = cols * r * 2 + (cols - 1) * gap, x0 = (W - gw) / 2 + r, y0 = 560 + used + 40;
    for (let i = 0; i < n; i++) {
      const cx = x0 + (i % cols) * (r * 2 + gap), cy = y0 + Math.floor(i / cols) * (r * 2 + gap);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      if (i === p.target) { ctx.fillStyle = rewards > 0 ? th.text : "rgba(0,0,0,0)"; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = th.accent; ctx.stroke(); ctx.fillStyle = rewards > 0 ? th.bg : th.accent; ctx.font = "800 30px " + body; ctx.direction = "ltr"; ctx.fillText("FREE", cx, cy + 11); ctx.direction = rtl ? "rtl" : "ltr"; }
      else if (i < s) { ctx.fillStyle = th.accent; ctx.fill(); ctx.fillStyle = th.on; ctx.font = "700 54px " + body; ctx.fillText("★", cx, cy + 19); }
      else { ctx.setLineDash([10, 10]); ctx.lineWidth = 4; ctx.strokeStyle = "rgba(" + th.glow + ",.45)"; ctx.stroke(); ctx.setLineDash([]); }
    }
    ctx.fillStyle = th.accent; ctx.font = "700 44px " + body;
    ctx.fillText(tr("shareSub", { n: p.target, nth: ordinal(p.target + 1) }), W / 2, H - 170);
    ctx.fillStyle = th.muted; ctx.font = "500 34px " + body; ctx.direction = "ltr";
    ctx.fillText(location.host + location.pathname.replace(/\/$/, ""), W / 2, H - 100);
    const blob = await new Promise((res) => cv.toBlob(res, "image/png"));
    const file = new File([blob], "amed-cafe-card.png", { type: "image/png" });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Amed Cafe" }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "amed-cafe-card.png"; document.body.append(a); a.click(); a.remove();
    const err = $("err"); err.style.color = "var(--accent)"; err.textContent = tr("shareSaved"); err.hidden = false;
  }

  function showNotFound() {
    lastEntry = null;
    const r = $("result"); r.textContent = ""; r.hidden = false;
    r.append(el("div", { class: "notfound" }, el("h2", { text: tr("nfTitle") }), el("p", { text: tr("nfText") })));
  }

  $("checkForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("err"), fail = (k) => { err.textContent = tr(k); err.hidden = false; };
    err.hidden = true;
    const d = norm($("phone").value), pin = norm("1" + $("pin").value).slice(1);
    if (d.length < 6) return fail("needPhone");
    if (pin.length !== 4) return fail("needPin");
    if (!loaded) return fail("loading");
    try {
      const key = await hash(d, pin), entry = DATA.cards[key];
      if (entry) { try { localStorage.setItem("amed-session", key); } catch (_) {} $("pin").value = ""; showCards(entry); } else showNotFound();
    }
    catch (_) { fail("noCrypto"); }
  });
  for (const b of document.querySelectorAll(".langs button")) b.addEventListener("click", () => setLang(b.dataset.lang));
  $("phone").addEventListener("change", () => { const wa = DATA && DATA.contact && DATA.contact.wa; if (wa) $("forgot").href = "https://wa.me/" + wa + "?text=" + encodeURIComponent(tr("forgotMsg") + $("phone").value); });
  // Add to home screen: Android shows an install button; iPhone shows a short tip. Works on the website, not inside claude.ai.
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; $("installBox").hidden = false; $("installBtn").hidden = false; });
  $("installBtn").addEventListener("click", async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (_) {} deferredPrompt = null; $("installBox").hidden = true; });
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone && location.hostname.endsWith("github.io")) { $("installBox").hidden = false; $("iosTip").hidden = false; }
  if ("serviceWorker" in navigator && location.hostname.endsWith("github.io")) { try { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {}); } catch (_) {} }

  let start = (location.hash || "").replace("#", "");
  if (!T[start]) { try { start = localStorage.getItem("amed-lang") || ""; } catch (_) { start = ""; } }
  if (!T[start]) { const nl = (navigator.language || "").toLowerCase(); start = nl.startsWith("ar") ? "ar" : nl.startsWith("en") ? "en" : "ku"; }
  setLang(start);
  window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (T[h]) setLang(h); });

  fetch("data.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw 0; return r.json(); })
    .then((d) => {
      DATA = d; loaded = true; renderStatic();
      let key = null; try { key = localStorage.getItem("amed-session"); } catch (_) {}
      if (key && DATA.cards[key]) showCards(DATA.cards[key], false);
    })
    .catch(() => { const err = $("err"); err.textContent = tr("noLoad"); err.hidden = false; });
})();
</script>
</body>
</html>
