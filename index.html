<style>
/* Espresso & Gold: espresso background, latte text, gold accents (Thamir chose sample B). */
:root {
  --bg: #1C120D; --surface: #2A1C15; --ink: #F3E9DC; --muted: #C4B09C; --gold: #D4A373; --gold2: #E3B27D; --line: #3F2D23;
  --serif: "Cormorant Garamond", Georgia, serif; --sans: Jost, system-ui, sans-serif;
  color-scheme: dark;
}
.rtl { --serif: "Noto Naskh Arabic", "Cormorant Garamond", serif; --sans: "Noto Sans Arabic", Jost, system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font: 300 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
.kicker { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
.rtl .kicker { letter-spacing: 0; font-size: 14px; font-weight: 500; }
.latin { font-family: "Cormorant Garamond", Georgia, serif; }

/* Header */
header { position: absolute; top: 0; left: 0; right: 0; z-index: 5; }
header .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
.logo { display: block; width: 96px; height: 44px; background: url(logo-gold.png) center/contain no-repeat; }
.langs { display: flex; gap: 6px; }
.langs button { border: 0; background: none; padding: 4px; border-radius: 6px; opacity: .5; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 1.5px var(--gold); }
.flag { width: 28px; height: 19px; display: block; border-radius: 3px; }

/* Hero */
.hero { position: relative; padding: 100px 0 0; text-align: center;
  background: radial-gradient(70% 40% at 50% 60%, #6F4E3788, transparent 70%), radial-gradient(120% 60% at 50% 0%, #2E1E15, var(--bg)); }
.hero h1 { font-size: 46px; line-height: 1.05; margin: 12px 0 10px; }
.rtl .hero h1 { font-size: 38px; line-height: 1.35; }
.hero h1 i { color: var(--gold2); font-family: "Cormorant Garamond", Georgia, serif; }
.hero p { color: var(--muted); max-width: 30ch; margin: 0 auto; }
.trio { position: relative; height: 290px; max-width: 340px; margin: 22px auto 0; }
.trio img { position: absolute; bottom: 0; filter: drop-shadow(0 20px 22px #000a); }
.trio .c { height: 230px; left: 6px; transform: rotate(-6deg); }
.trio .s { height: 230px; right: 6px; transform: rotate(6deg); }
.trio .g { height: 280px; left: 50%; transform: translateX(-50%); z-index: 2; }
.trio .floor { position: absolute; bottom: -6px; left: 10%; right: 10%; height: 30px; background: radial-gradient(closest-side, #000a, transparent); }
.cta { display: flex; flex-direction: column; gap: 10px; margin: 26px auto 0; max-width: 340px; }
.btn { display: block; padding: 15px; border-radius: 99px; text-decoration: none; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; text-align: center; }
.rtl .btn { letter-spacing: 0; font-size: 15px; }
.btn.pri { background: linear-gradient(135deg, #E3B27D, #B98552); color: #1C120D; }
.btn.sec { border: 1px solid #D4A37366; color: var(--gold2); }
.status { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; margin: 26px auto 0; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); max-width: 560px; }
.status b { color: var(--ink); font-weight: 500; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #6FCF8A; margin-inline-end: 7px; box-shadow: 0 0 8px #6FCF8A; vertical-align: middle; }
.dot.off { background: #E3786E; box-shadow: 0 0 8px #E3786E; }

/* Sections */
section { padding: 56px 0 0; scroll-margin-top: 10px; }
.head { text-align: center; margin-bottom: 22px; }
.head .kicker { display: block; }
.head h2 { font-size: 36px; margin-top: 4px; line-height: 1.2; }
.rtl .head h2 { font-size: 30px; }
.orn { display: block; width: 60px; height: 1px; background: var(--gold); margin: 12px auto 0; position: relative; }
.orn::after { content: ""; position: absolute; left: 50%; top: -3px; width: 7px; height: 7px; background: var(--gold); transform: translateX(-50%) rotate(45deg); }
.note { text-align: center; font-size: 13px; color: var(--muted); margin-top: 8px; }

/* Menu */
.tabs { display: flex; gap: 6px; justify-content: safe center; overflow-x: auto; scrollbar-width: none; margin: 0 -20px 14px; padding: 0 20px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { font: inherit; font-size: 13px; white-space: nowrap; flex: none; color: var(--muted); background: #ffffff0a; border: 1px solid var(--line); padding: 7px 12px; border-radius: 99px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: #1C120D; background: var(--gold); border-color: var(--gold); font-weight: 500; }
.scroller { display: flex; align-items: flex-start; gap: 14px; overflow-x: auto; overflow-y: hidden; transition: height .25s ease; scroll-snap-type: x mandatory; margin: 0 -20px; padding: 4px 20px 10px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.mc { flex: 0 0 82%; scroll-snap-align: center; background: linear-gradient(180deg, #2E1F17, #241812); border: 1px solid var(--line); border-radius: 22px; padding: 20px; }
.mc h3 { font-size: 28px; color: var(--gold2); margin-bottom: 6px; }
.rtl .mc h3 { font-size: 24px; }
.mc .shot { height: 120px; display: grid; place-items: center; margin-bottom: 4px; }
.mc .shot img { height: 120px; filter: drop-shadow(0 10px 12px #000a); }
.li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #3F2D2399; font-size: 15px; }
.li:last-child { border: 0; }
.li .p { color: var(--gold2); font-weight: 400; white-space: nowrap; direction: ltr; }
.li .p small { font-size: 11px; color: var(--muted); margin-inline-start: 3px; }
.li .sub { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.45; margin-top: 2px; }

/* Rewards */
.rewards { display: grid; gap: 14px; }
.reward { border: 1px solid #D4A37355; border-radius: 24px; padding: 26px 22px; text-align: center; background: radial-gradient(80% 60% at 50% 0%, #6F4E3744, transparent); }
.reward .big { font-family: "Cormorant Garamond", serif; font-variant-numeric: lining-nums; font-size: 64px; line-height: 1; color: var(--gold2); direction: ltr; }
.reward h3 { font-size: 26px; margin: 8px 0 4px; }
.reward p { color: var(--muted); }
.progs { display: grid; gap: 10px; margin: 18px 0; text-align: start; }
.prog { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #ffffff08; border-radius: 14px; padding: 10px 14px; }
.prog b { font-weight: 500; }
.stamps { display: flex; gap: 5px; direction: ltr; }
.stamps i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #D4A37388; }
.stamps i.free { border: 1.5px dashed var(--gold2); }
.tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 16px; }
.tiers div { padding: 9px 2px; border-radius: 10px; background: #ffffff0d; }
.tiers b { display: block; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
.rtl .tiers b { letter-spacing: 0; text-transform: none; font-size: 14px; }
.tiers span { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; margin-top: 3px; }
.tiers .t1 b { color: #C98F6B; } .tiers .t2 b { color: #D9DEE3; } .tiers .t3 b { color: var(--gold2); } .tiers .t4 b { color: #B9C7D6; }
.reward .btn { margin: 20px auto 0; max-width: 300px; }

/* Events */
.tl { border-inline-start: 1px solid var(--gold); margin-inline-start: 8px; padding-inline-start: 20px; }
.ev { position: relative; padding-bottom: 22px; }
.ev::before { content: ""; position: absolute; inset-inline-start: -25px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); }
.ev small { color: var(--gold); font-size: 13px; }
.ev h3 { font-size: 24px; line-height: 1.3; }
.ev p { color: var(--muted); font-size: 14px; }
.empty { text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 18px; padding: 22px; }

/* Gallery */
.gal { display: grid; grid-template-columns: 2fr 1fr; grid-auto-rows: 120px; gap: 8px; }
.ph { border-radius: 14px; border: 1px dashed #D4A37355; background: linear-gradient(135deg, #2A1C15, #33231A); display: grid; place-items: center; color: #C4B09CAA; font-size: 12px; text-align: center; padding: 8px; }
.ph.big { grid-row: span 2; }

/* Visit */
.info { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 6px 20px; }
.r { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.r:last-child { border: 0; }
.r > span { color: var(--muted); font-size: 14px; white-space: nowrap; }
.r b { font-weight: 400; text-align: end; }
.r a { color: var(--gold2); text-decoration: none; text-align: end; }
.r .soon { color: #C4B09C88; font-size: 14px; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.social { display: flex; justify-content: center; gap: 18px; margin-bottom: 22px; }
.social a { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-size: 12px; }
.rtl .social a { font-size: 13px; }
.social .ic { width: 58px; height: 58px; border-radius: 50%; border: 1px solid #D4A37399; display: grid; place-items: center; color: var(--gold2); background: radial-gradient(circle at 50% 30%, #3A281E, #241812); transition: border-color .2s, box-shadow .2s; }
.social a:hover .ic, .social a:focus-visible .ic { border-color: var(--gold2); box-shadow: 0 0 16px -4px #D4A373AA; }
.social svg { width: 24px; height: 24px; display: block; }
@media (max-width: 350px) { .social { gap: 10px; } .social .ic { width: 52px; height: 52px; } }

footer { text-align: center; padding: 50px 0 calc(40px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 14px; }
footer .logo { margin: 0 auto 10px; width: 130px; height: 58px; }
footer small { display: block; margin-top: 14px; font-size: 12px; opacity: .7; }

/* Desktop */
@media (min-width: 900px) {
  .hero { text-align: start; padding-top: 120px; }
  .hero .hg { display: grid; grid-template-columns: 1.1fr 1fr; grid-template-areas: "t1 art" "t2 art"; column-gap: 30px; align-items: end; }
  .hg .t1 { grid-area: t1; } .hg .t2 { grid-area: t2; align-self: start; } .hg .art { grid-area: art; align-self: center; }
  .hero h1 { font-size: 68px; } .rtl .hero h1 { font-size: 54px; }
  .hero p { margin: 0; font-size: 18px; }
  .cta { flex-direction: row; margin: 30px 0 0; max-width: none; } .cta .btn { padding: 15px 28px; }
  .status { justify-content: flex-start; border: 0; padding: 0; margin: 26px 0 0; }
  .trio { height: 420px; max-width: 460px; } .trio .g { height: 410px; } .trio .c, .trio .s { height: 330px; }
  .tabs { display: none; }
  .scroller { display: block; columns: 3; column-gap: 14px; overflow: visible; margin: 0; padding: 0; }
  .mc { break-inside: avoid; margin-bottom: 14px; }
  .swipe { display: none; }
  .rewards { grid-template-columns: 1fr 1fr; align-items: start; }
  .gal { grid-template-columns: 2fr 1fr 1fr; grid-auto-rows: 180px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .split section { padding-top: 56px; }
  .head h2 { font-size: 44px; }
}
</style>

(() => {

      myCard: "کارتا من", exploreMenu: "مێنیوێ ببینە", open: "نوکە ڤەکریە", closed: "گرتیە · دەمژمێر 8:00 سپێدێ ڤەدبیت", hoursShort: "هەمی رۆژ · 8:00 سپێدێ – 1:00 شەڤێ",
      menuK: "مێنیو", menuT: "بۆ تە هاتیە ئامادەکرن", swipe: "بۆ زێدەتر بکێشە · ", iqd: "د.ع", menuNote: "بها ب دینارێن عێراقی", sampleNote: "مێنیوەکێ نموونەیە · مێنیوێ تەمام ب زوویی دێ هێت",
      rewK: "خەلاتێن Amed", rewT: "{n} بکڕە، یا {nth} بێ بەرامبەرە", rewP: "کارتێن جودا بۆ ڤەخوارن و نێرگەلێ — تنێ ژمارا مۆبایلا خۆ ل کاونتەری بدە. خەلاتێن بێ بەرامبەر بۆ ماوێ {d} رۆژان دمینن.",

      levelsT: "ئاستێن VIP", levelsP: "هندی تو پتر سەرەدانا مە بکەی، ئاستێ تە بلندتر دبیت.", member: "ئەندام", start: "ژ سەرەدانا ئێکێ", lvRow: "{n} سەرەدان", lvRowOr: "{n} سەرەدان یان {s} مۆر",
      lv: { Silver: "زیڤین", Gold: "زێڕین", Platinum: "پلاتینی" }, checkCard: "کارتا من نیشان بدە",
      evK: "دێ هێن", evT: "پێشکێشی و بۆنە", evEmpty: "نوکە چ بۆنە نینن. بۆنە و پێشکێشیێن نوو دێ ب خۆ ل ڤێرە دیار بن.", xStamps: "×{m} مۆر", everyDay: "هەمی رۆژ",
      galK: "وێنە", galT: "جهێ مە", photoSoon: "وێنە ب زوویی",
      visK: "سەرەدان", visT: "سەرەدانا مە بکە", hours: "دەمژمێرێن کاری", everyDayHours: "هەمی رۆژ · 8:00 سپێدێ – 1:00 شەڤێ", location: "جه", openMaps: "ل Google Maps ڤەکە",
      whatsapp: "واتسئاپ", instagram: "ئینستاگرام", tiktok: "تیکتۆک", snapchat: "سناپچات", openSnap: "ل سناپچات ڤەکە", phone: "تەلەفۆن", review: "هەلسەنگاندن", reviewLink: "ل Google بنڤیسە ★", soon: "ب زوویی",
      tagline: "جهێ ئارامیا تە",
    },
  };
  const ORD_AR = { 6: "سادس", 7: "سابع", 8: "ثامن", 9: "تاسع", 10: "عاشر", 11: "حادي عشر" };
  const LOC = { en: "en-GB", ar: "ar-IQ-u-nu-latn" };
  const KU_M = ["کانوونا دووێ", "شوبات", "ئادار", "نیسان", "گولان", "حزیران", "تیرمەه", "ئاب", "ئەیلوول", "تشرینا ئێکێ", "تشرینا دووێ", "کانوونا ئێکێ"];
  const KU_D = ["یەکشەمبی", "دووشەمبی", "سێشەمبی", "چارشەمبی", "پێنجشەمبی", "ئەینی", "شەمبی"];
  const DEFAULT_PROGS = [
    { id: "drinks", name: "Drinks", target: 7, reward: "free drink", name_ar: "المشروبات", reward_ar: "مشروب مجاني", name_ku: "ڤەخوارن", reward_ku: "ڤەخوارنەکا بێ بەرامبەر" },
    { id: "shisha", name: "Shisha", target: 7, reward: "free shisha", name_ar: "الأركيلة", reward_ar: "أركيلة مجانية", name_ku: "نێرگەلە", reward_ku: "نێرگەلەکا بێ بەرامبەر" },
  ];
  const DEFAULT_LEVELS = [{ name: "Silver", visits: 50, stamps: 90 }, { name: "Gold", visits: 180 }, { name: "Platinum", visits: 360 }];

  let lang = "ku", DATA = null, MENU = null, activeCat = 0;
  const $ = (id) => document.getElementById(id);
  const tr = (k, v = {}) => String(T[lang][k] ?? T.en[k] ?? "").replace(/\{(\w+)\}/g, (m, x) => (x in v ? v[x] : m));
  const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } for (const k of kids) if (k != null) e.append(k); return e; };
  const pick = (o) => (o && (o[lang] || o.en)) || "";
  const pname = (p) => (lang !== "en" && p["name_" + lang]) || p.name;
  const preward = (p) => (lang !== "en" && p["reward_" + lang]) || p.reward;
  const ordinal = (n) => lang === "en" ? n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th") : lang === "ar" ? (ORD_AR[n] || String(n)) : n + "ەمین";
  const num = (n) => Number(n).toLocaleString("en-US");
  function dfmt(d, o) {
    if (lang !== "ku") return d.toLocaleDateString(LOC[lang], o);
    const parts = [];
    if (o.weekday) parts.push(KU_D[d.getDay()]);
    if (o.day) parts.push(d.getDate());
    if (o.month) parts.push(KU_M[d.getMonth()]);
    return parts.join(" ");
  }

  function isOpen() {
    const h = Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Baghdad", hour: "2-digit", hourCycle: "h23" }).format(new Date()));
    return h >= OPEN_H || h < CLOSE_H;
  }

  function renderStatus() {
    const o = isOpen();
    $("dot").classList.toggle("off", !o);
    $("openTxt").textContent = o ? tr("open") : tr("closed");
  }

  // Scroll a horizontal row so that child is centred (works left-to-right and right-to-left).
  function centerIn(row, child) {
    const r = row.getBoundingClientRect(), c = child.getBoundingClientRect();
    row.scrollBy({ left: (c.left + c.width / 2) - (r.left + r.width / 2), behavior: "smooth" });
  }

  // On phones the menu is a swipe row: fit its height to the card in view so short cards leave no gap.
  function fitMenu() {
    const sc = $("scroller"), card = sc.children[activeCat];
    sc.style.height = card && getComputedStyle(sc).display === "flex" ? card.offsetHeight + 14 + "px" : "";
  }

  function renderMenu() {
    const tabs = $("tabs"), sc = $("scroller");
    tabs.textContent = ""; sc.textContent = "";
    if (!MENU) return;
    MENU.categories.forEach((c, i) => {
      tabs.append(el("button", { type: "button", role: "tab", "aria-selected": String(i === activeCat), onclick: () => {
        activeCat = i; fitMenu(); for (const b of tabs.children) b.setAttribute("aria-selected", String(b === tabs.children[i]));
        centerIn(sc, sc.children[i]);
      } }, pick(c.name)));
      const card = el("div", { class: "mc" });
      if (c.photo) card.append(el("div", { class: "shot" }, el("img", { src: c.photo, alt: "", loading: "lazy" })));
      card.append(el("h3", { text: pick(c.name) }));
      for (const it of c.items) {
        const opts = it.options || [];
        const same = opts.every((o) => o.price === opts[0].price);
        const sub = [opts.length ? opts.map((o) => pick(o.name) + (same ? "" : " " + num(o.price))).join(" · ") : "", pick(it.note)].filter(Boolean).join(" — ");
        card.append(el("div", { class: "li" }, el("span", {}, pick(it.name), sub ? el("small", { class: "sub", text: sub }) : null), el("span", { class: "p" }, num(it.price), el("small", { text: tr("iqd") }))));
      }
      sc.append(card);
    });
    $("menuNote").textContent = MENU.sample ? tr("sampleNote") : tr("menuNote");
    activeCat = Math.min(activeCat, MENU.categories.length - 1); fitMenu();
  }

  function renderRewards() {
    const progs = (DATA && DATA.programs && DATA.programs.length) ? DATA.programs : DEFAULT_PROGS;
    const t = progs[0].target, same = progs.every((p) => p.target === t);
    $("big").textContent = same ? t + " + 1" : "+ 1";
    $("rewT").textContent = tr("rewT", { n: t, nth: ordinal(t + 1) });
    const box = $("progs"); box.textContent = "";
    for (const p of progs) {
      const st = el("span", { class: "stamps", "aria-hidden": "true" });
      for (let i = 0; i < p.target; i++) st.append(el("i"));
      st.append(el("i", { class: "free" }));
      box.append(el("div", { class: "prog" }, el("span", {}, el("b", { text: pname(p) }), el("br"), el("small", { text: tr("progRow", { n: p.target, reward: preward(p) }) })), st));
    }
    $("rewP").textContent = tr("rewP", { d: (DATA && (DATA.expiryDays || (DATA.rules && DATA.rules.expiryDays))) || 60 });
    const lv = [...((DATA && DATA.levels && DATA.levels.length) ? DATA.levels : DEFAULT_LEVELS)].sort((a, b) => a.visits - b.visits);
    const tiers = $("tiers"); tiers.textContent = "";
    tiers.append(el("div", { class: "t1" }, el("b", { text: tr("member") }), el("span", { text: tr("start") })));
    lv.slice(0, 3).forEach((l, i) => tiers.append(el("div", { class: "t" + (i + 2) }, el("b", { text: T[lang].lv[l.name] || l.name }),

    // Level perks are deliberately not shown (showPerks is off).
  }

  function renderEvents() {
    const box = $("evList"); box.textContent = "";
    const tl = el("div", { class: "tl" });
    const DN = (i) => dfmt(new Date(2024, 0, 7 + Number(i)), { weekday: "long" });
    for (const ev of (DATA && DATA.events) || []) {
      const d = new Date(ev.date + "T12:00:00");
      tl.append(el("div", { class: "ev" },
        el("small", { text: [dfmt(d, { weekday: "long", day: "numeric", month: "long" }), ev.from ? ev.from + (ev.to ? "–" + ev.to : "") : ""].filter(Boolean).join(" · ") }),
        el("h3", { text: ev.title }),
        el("p", { text: [ev.details, ev.multiplier > 1 ? tr("xStamps", { m: ev.multiplier }) : ""].filter(Boolean).join(" · ") })));
    }
    for (const o of (DATA && DATA.offers) || []) {
      const days = o.days && o.days.length ? o.days.slice().sort().map(DN).join(lang === "en" ? ", " : "، ") : tr("everyDay");
      const progs = (DATA.programs || []);
      const cards = o.programs && o.programs.length ? progs.filter((p) => o.programs.includes(p.id)).map(pname).join(" + ") : "";
      tl.append(el("div", { class: "ev" },
        el("small", { text: [days, o.from && o.to ? o.from + "–" + o.to : ""].filter(Boolean).join(" · ") }),
        el("h3", { text: o.name }),
        el("p", { text: [cards, o.multiplier > 1 ? tr("xStamps", { m: o.multiplier }) : ""].filter(Boolean).join(" · ") })));
    }
    box.append(tl.children.length ? tl : el("p", { class: "empty", text: tr("evEmpty") }));
  }

  function renderGallery() {
    const g = $("gal"); g.textContent = "";
    for (let i = 0; i < 5; i++) g.append(el("div", { class: "ph" + (i === 0 ? " big" : "") }, tr("photoSoon")));
  }

  function renderInfo() {
    // Social media: a row of gold icons (only the accounts that are filled in).
    const wa0 = (CONTACT.whatsapp || (DATA && DATA.contact && DATA.contact.wa) || "").replace(/\D/g, "");
    const soc = $("social"); soc.textContent = "";
    for (const [key, icon, href] of [
      ["whatsapp", "wa", wa0 && "https://wa.me/" + wa0],
      ["instagram", "ig", CONTACT.instagram && "https://instagram.com/" + CONTACT.instagram],

      ["snapchat", "sc", CONTACT.snapchat],
    ]) {
      if (!href) continue;
      const a = el("a", { href, target: "_blank", rel: "noopener", "aria-label": tr(key) }, el("span", { class: "ic" }), tr(key));
      a.firstChild.innerHTML = '<svg aria-hidden="true"><use href="#' + icon + '"/></svg>';
      soc.append(a);
    }
    const box = $("info"); box.textContent = "";
    const soon = () => el("span", { class: "soon", text: tr("soon") });
    const link = (href, text, ltr) => el("a", { href, target: "_blank", rel: "noopener", class: ltr ? "ltr" : "" }, text);
    const row = (label, val) => box.append(el("div", { class: "r" }, el("span", { text: label }), val));

    const addr = pick(CONTACT.address);
    row(tr("location"), CONTACT.maps ? link(CONTACT.maps, addr || tr("openMaps")) : addr ? el("b", { text: addr }) : soon());

    row(tr("review"), link(CONTACT.review, tr("reviewLink")));
  }

  function setLang(l) {
    lang = T[l] ? l : "ku";
    document.documentElement.lang = lang === "ku" ? "ckb" : lang;
    document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
    document.body.classList.toggle("rtl", lang !== "en");
    for (const b of document.querySelectorAll(".langs button")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    for (const n of document.querySelectorAll("[data-t]")) n.textContent = tr(n.dataset.t);

    try { localStorage.setItem("amed-lang", lang); } catch (_) {}
    renderStatus(); renderMenu(); renderRewards(); renderEvents(); renderGallery(); renderInfo();
  }

  for (const b of document.querySelectorAll(".langs button")) b.addEventListener("click", () => { setLang(b.dataset.lang); history.replaceState(null, "", "#" + lang); });
  $("scroller").addEventListener("scroll", () => {
    const sc = $("scroller"), r = sc.getBoundingClientRect(), mid = r.left + r.width / 2;
    let best = 0, bd = 1e9;
    [...sc.children].forEach((c, i) => { const cr = c.getBoundingClientRect(), d = Math.abs(cr.left + cr.width / 2 - mid); if (d < bd) { bd = d; best = i; } });
    if (best !== activeCat) {
      activeCat = best; const tabs = $("tabs");
      [...tabs.children].forEach((b, i) => b.setAttribute("aria-selected", String(i === best)));
      if (tabs.children[best]) centerIn(tabs, tabs.children[best]);
      fitMenu();
    }
  }, { passive: true });
  window.addEventListener("resize", fitMenu);
  $("yr").textContent = new Date().getFullYear();

  let start = (location.hash || "").replace("#", "");
  if (!T[start]) { try { start = localStorage.getItem("amed-lang") || ""; } catch (_) { start = ""; } }
  if (!T[start]) { const nl = (navigator.language || "").toLowerCase(); start = nl.startsWith("ar") ? "ar" : nl.startsWith("en") ? "en" : "ku"; }
  setLang(start);
  window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (T[h]) setLang(h); });
  setInterval(renderStatus, 60000);

  fetch("menu.json", { cache: "no-cache" }).then((r) => r.ok ? r.json() : null).then((m) => { if (m) { MENU = m; renderMenu(); } }).catch(() => {});
  fetch("data.json", { cache: "no-store" }).then((r) => r.ok ? r.json() : null).then((d) => { if (d) { DATA = d; renderRewards(); renderEvents(); renderInfo(); } }).catch(() => {});
})();
