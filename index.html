<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Amed Cafe loyalty rewards: check your drink and shisha stamps.">
<meta property="og:title" content="Amed Cafe Rewards">
<meta property="og:description" content="Buy 7, and the 8th is on us. Check your loyalty card.">
<meta property="og:image" content="logo.png">
<link rel="icon" href="logo.png">
<meta name="theme-color" content="#1F5C45">
<title>Amed Cafe Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap">
<style>
/* Layout: one column for a phone in the hand — brand + language, "check your card", the result, then how it works. */
:root {
  --logo-filter: none;
  --bg: #EDF0EB;
  --surface: #FFFFFF;
  --ink: #1C231E;
  --muted: #5B675E;
  --line: #D3DAD2;
  --accent: #1F5C45;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEAE2;
  --card: #1F4B3A;
  --card-ink: #F3EFE6;
  --card-dim: rgba(243,239,230,.28);
  --stamp: #D9A15B;
  --stamp-ink: #3A2412;
  --danger: #A3342C;
  --f-display: "Gloock", "Georgia", "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --surface: #1A201C; --ink: #E6EBE5; --muted: #98A59B; --line: #2C3530;
    --accent: #62B48E; --accent-ink: #0C1912; --accent-soft: #1F3329;
    --card: #1C3A2E; --card-ink: #F1ECE1; --card-dim: rgba(241,236,225,.22);
    --stamp: #E0AC69; --stamp-ink: #2E1C0E; --danger: #E3786E; --logo-filter: invert(1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --surface: #1A201C; --ink: #E6EBE5; --muted: #98A59B; --line: #2C3530;
  --accent: #62B48E; --accent-ink: #0C1912; --accent-soft: #1F3329;
  --card: #1C3A2E; --card-ink: #F1ECE1; --card-dim: rgba(241,236,225,.22);
  --stamp: #E0AC69; --stamp-ink: #2E1C0E; --danger: #E3786E; --logo-filter: invert(1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body.rtl { --f-body: "Noto Sans Arabic", system-ui, sans-serif; --f-display: "Noto Sans Arabic", serif; }
body.rtl .hero h1, body.rtl .card h2, body.rtl .check .ttl, body.rtl .notfound h2, body.rtl .offer h4 { font-weight: 800; letter-spacing: 0; }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 26px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand .logo { width: min(220px, 56vw); height: auto; display: block; filter: var(--logo-filter); }
.langs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
.langs button { border: 0; background: none; border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: .85rem; cursor: pointer; min-height: 36px; font-family: "Figtree", "Noto Sans Arabic", sans-serif; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.hero .tag { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; margin: 0 0 8px; }
body.rtl .hero .tag { letter-spacing: 0; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.1rem, 9vw, 3.1rem); line-height: 1.08; margin: 0 0 10px; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--stamp); }
.hero p { margin: 0; color: var(--muted); max-width: 46ch; }

.check { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; }
.check .ttl { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; }
.check label { font-weight: 600; font-size: .85rem; color: var(--muted); margin-bottom: -4px; }
.check input { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 1.15rem; font-family: var(--f-mono); letter-spacing: .03em; min-height: 52px; width: 100%; min-width: 0; direction: ltr; text-align: start; }
body.rtl .check input { text-align: right; }
.check input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.check .row { display: flex; gap: 8px; }
.check .row input { flex: 1; }
.check button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 0 18px; font-weight: 700; min-height: 52px; cursor: pointer; }
.check button:hover { filter: brightness(1.08); }
.check small { color: var(--muted); font-size: .84rem; }
.err { color: var(--danger); margin: 0; font-size: .92rem; }

.result { display: grid; gap: 14px; }
.result .hello { font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; margin: 0; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
.summary .facts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.summary .facts div { display: grid; min-width: 0; }
.summary .facts span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
body.rtl .summary .facts span { letter-spacing: 0; }
.summary .facts b { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
body.rtl .summary .facts b { font-weight: 700; }
.vip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vip .badge { background: var(--ink); color: var(--bg); font-weight: 800; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; padding: 4px 12px; border-radius: 99px; }
.meter { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.vip small { color: var(--muted); }

.card { background: var(--card); color: var(--card-ink); border-radius: 18px; padding: 20px; position: relative; overflow: hidden; }
.card::after { content: ""; position: absolute; right: -50px; top: -50px; width: 170px; height: 170px; border-radius: 50%; border: 12px solid var(--card-dim); opacity: .35; pointer-events: none; }
.card .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; position: relative; z-index: 1; }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; margin: 0; }
.card .rule { font-size: .74rem; opacity: .8; font-weight: 600; text-align: end; }
.stamps { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin: 16px auto 14px; max-width: 340px; position: relative; z-index: 1; direction: ltr; }
.slot { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 2px dashed var(--card-dim); display: grid; place-items: center; font-family: var(--f-mono); font-size: .78rem; color: var(--card-dim); }
.slot.on { border: 0; background: var(--stamp); color: var(--stamp-ink); }
.slot.on svg { width: 56%; height: 56%; }
.slot.reward { border-style: solid; border-color: var(--stamp); color: var(--stamp); font-family: var(--f-body); font-weight: 800; font-size: .7rem; text-align: center; }
.slot.reward.lit { background: var(--card-ink); color: var(--card); border-color: var(--card-ink); }
.card .line { position: relative; z-index: 1; }
.card .line strong { font-size: 1.15rem; }
.ready { display: block; margin-top: 10px; background: var(--stamp); color: var(--stamp-ink); font-weight: 700; padding: 10px 12px; border-radius: 12px; position: relative; z-index: 1; }
.card .tally { display: flex; gap: 18px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--card-dim); position: relative; z-index: 1; font-size: .85rem; }
.card .tally b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.4rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.myqr { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.myqr .qr { background: #fff; padding: 8px; border-radius: 10px; width: 136px; height: 136px; flex: none; }
.myqr .qr img, .myqr .qr canvas { width: 120px !important; height: 120px !important; display: block; }
.myqr div.txt { flex: 1 1 180px; min-width: 0; }
.myqr b { display: block; font-size: 1.05rem; }
.myqr code { font-family: var(--f-mono); font-size: 1.2rem; letter-spacing: .12em; }
.myqr p { margin: 4px 0 0; color: var(--muted); font-size: .88rem; }
.updated { color: var(--muted); font-size: .8rem; margin: 0; }
.again { justify-self: start; border: 0; background: none; color: var(--accent); font-weight: 700; padding: 4px 0; cursor: pointer; }

.notfound { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.notfound h2 { font-family: var(--f-display); font-weight: 400; margin: 0 0 6px; font-size: 1.35rem; }
.notfound p { margin: 0; color: var(--muted); }

section h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 12px; }
body.rtl section h3 { letter-spacing: 0; font-size: .9rem; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.steps li { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 12px; align-items: start; }
.steps .n { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.2rem; }
.steps b { display: block; }
.steps span { color: var(--muted); font-size: .94rem; }
.offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.offer { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.offer .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.offer h4 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; }
.offer .eq { font-weight: 700; color: var(--accent); font-size: .9rem; white-space: nowrap; }
.strip { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; direction: ltr; }
.strip i { width: 22px; height: 22px; border-radius: 50%; background: var(--stamp); color: var(--stamp-ink); display: grid; place-items: center; }
.strip i svg { width: 14px; height: 14px; }
.strip .plus { color: var(--muted); font-weight: 700; padding: 0 2px; }
.strip .free { width: auto; padding: 0 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-style: normal; font-size: .68rem; font-weight: 800; letter-spacing: .06em; height: 22px; display: inline-grid; place-items: center; }
.offer p { margin: 0; color: var(--muted); font-size: .9rem; }
.levels { display: grid; gap: 8px; }
.levels div { display: flex; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; flex-wrap: wrap; }
.levels b { font-weight: 800; }
.levels span { color: var(--muted); font-size: .9rem; }
footer { color: var(--muted); font-size: .82rem; border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 6px; }
footer p { margin: 0; }
</style>
</head>
<body>
<main id="app">
  <header class="brand">
    <img class="logo" src="logo.png" alt="Amed Cafe, your comfort space" width="640" height="289">
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ku">کوردی</button>
      <button type="button" data-lang="ar">العربية</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </header>

  <div class="hero">
    <p class="tag" data-t="tag"></p>
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
  </div>

  <form class="check" id="checkForm" novalidate>
    <strong class="ttl" data-t="checkTitle"></strong>
    <label for="phone" data-t="phone"></label>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0750 123 4567">
    <label for="pin" data-t="pin"></label>
    <div class="row">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••">
      <button type="submit" data-t="show"></button>
    </div>
    <small data-t="pinHelp"></small>
    <p class="err" id="err" hidden></p>
  </form>

  <div class="result" id="result" hidden></div>

  <section>
    <h3 data-t="howTitle"></h3>
    <ol class="steps">
      <li><span class="n">1</span><div><b data-t="s1t"></b><span data-t="s1d"></span></div></li>
      <li><span class="n">2</span><div><b data-t="s2t"></b><span data-t="s2d"></span></div></li>
      <li><span class="n" id="stepN">8</span><div><b id="s3t"></b><span data-t="s3d"></span></div></li>
    </ol>
  </section>

  <section>
    <h3 data-t="cardsTitle"></h3>
    <div class="offers" id="offers"></div>
  </section>

  <section id="levelsSec" hidden>
    <h3 data-t="levelsTitle"></h3>
    <div class="levels" id="levels"></div>
  </section>

  <footer>
    <p data-t="privacy"></p>
    <p id="foot"></p>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

      updated: "آخر تحديث للبطاقات {date} الساعة {time}. قد لا يظهر ختم الساعات الأخيرة بعد.",
    },
    ku: {
      tag: "پاداشتی دڵسۆزی", heroA: "{n} بکڕە، ", heroB: "دانەی {nth} لەسەر ئێمەیە.", heroSub: "لەگەڵ هەر داواکارییەکی {list} مۆرێک وەربگرە. لە خوارەوە کارتەکەت ببینە بۆ ئەوەی بزانیت چەندت ماوە بۆ دانەی بێبەرامبەری داهاتوو.", or: " یان ",
      checkTitle: "کارتەکەت ببینە", phone: "ژمارەی مۆبایل", pin: "ژمارەی نهێنی", show: "کارتەکەم پیشان بدە",
      pinHelp: "ژمارە نهێنییە 4 ژمارەییەکەت لە نامەی بەخێرهاتنی واتسئەپدایە. لەبیرت چووە؟ لە کاونتەر بپرسە.",
      needPhone: "ژمارەی مۆبایلەکەت بە تەواوی بنووسە.", needPin: "ژمارە نهێنییە 4 ژمارەییەکەت بنووسە.", loading: "کارتەکان بار دەکرێن. کەمێکی تر هەوڵ بدەرەوە.", noLoad: "کارتەکان بار نەبوون. هێڵی ئینتەرنێتەکەت بپشکنە و پەڕەکە نوێ بکەرەوە.", noCrypto: "ئەم وێبگەڕە ناتوانێت کارت بپشکنێت. لە Chrome یان Safari بیکەرەوە.",
      hello: "ئەمە کارتەکەتە", visits: "سەردانەکان", thisYear: "ئەمساڵ", lastVisit: "دوایین سەردان", never: "هێشتا نا", today: "ئەمڕۆ", yesterday: "دوێنێ", daysAgo: "{n} ڕۆژ لەمەوبەر",
      levelIs: "ئەندامی {level}", toNext: "{n} سەردانی تر بۆ {level}", perk: "تایبەتمەندییەکەت: {perk}",
      rule: "{n} بکڕە، دانەی {nth} بێبەرامبەر", more: "{n} ماوە", toGo: " بۆ {reward} · {s} لە {n} مۆر", ready1: "{reward} ئامادەیە! ژمارەکەت لە کاونتەر بڵێ بۆ وەرگرتنی.", readyN: "{k} پاداشتی بێبەرامبەرت هەیە: {reward}! ژمارەکەت لە کاونتەر بڵێ.", useBy: " پێش {date} بەکاری بهێنە.",
      stamped: "مۆرەکان تا ئێستا", collected: "پاداشتە وەرگیراوەکان",
      qrTitle: "کۆدی QR ی ئەندامێتیت", qrText: "لە کاونتەر پیشانی بدە بۆ ئەوەی بە خێرایی کارتەکەت بدۆزینەوە.", again: "ژمارەیەکی تر بپشکنە",
      nfTitle: "ئەم کارتەمان نەدۆزییەوە", nfText: "ژمارەی مۆبایل و ژمارەی نهێنی بپشکنە. دەبێت وەک ئەوەی لە کاونتەر دات بن. ئەگەر ئەمڕۆ بەشداریت کردووە، لەوانەیە کارتەکەت چەند کاتژمێرێک بخایەنێت تا لێرە دەربکەوێت. هێشتا ئەندام نیت؟ لە سەردانی داهاتوو داوا لە ستافەکەمان بکە تۆمارت بکەن.",
      howTitle: "چۆن کار دەکات", s1t: "لە کاونتەر بەشداری بکە", s1d: "ژمارەی مۆبایلەکەت بدە بە ستافەکەمان. بەشداریکردن بێبەرامبەرە و چەند چرکەیەک دەخایەنێت.", s2t: "لەگەڵ هەر داواکارییەک مۆرێک کۆبکەرەوە", s2d: "هەر خواردنەوە یان نێرگەلەیەک مۆرێک بۆ کارتەکەی خۆی زیاد دەکات.", s3t: "دانەی {nth} بێبەرامبەرە", s3d: "کاتێک کارتەکەت پڕ بوو، ژمارەکەت لە کاونتەر بڵێ و چێژ لە پاداشتەکەت وەربگرە.",
      cardsTitle: "کارتەکانی پاداشت", plusFree: "{n} + 1 بێبەرامبەر", collect: "{n} مۆر کۆبکەرەوە و {reward} وەربگرە.",
      levelsTitle: "ئاستەکانی VIP", levelRow: "دوای {n} سەردان",
      privacy: "ژمارەی مۆبایلەکەت تەنها بۆ کارتی دڵسۆزی بەکاردەهێنین، و ئەگەر ڕازی بوویت، بۆ ناردنی نامەی واتسئەپ دەربارەی پاداشتەکانت.",
      updated: "دوایین نوێکردنەوەی کارتەکان {date} کاتژمێر {time}. لەوانەیە مۆری چەند کاتژمێری دوایی هێشتا دەرنەکەوێت.",
    },
  };
  const ORD = { ar: { 8: "ثامن", 6: "سادس", 7: "سابع", 9: "تاسع", 10: "عاشر", 11: "حادي عشر" } };
  const LOC = { en: undefined, ar: "ar-IQ", ku: "ckb-IQ" };

  let lang = "ku", DATA = null, loaded = false, lastEntry = null;
  const tr = (k, vars = {}) => String(T[lang][k] || T.en[k] || "").replace(/\{(\w+)\}/g, (m, v) => (v in vars ? vars[v] : m));
  const ordinal = (n) => lang === "en" ? n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th") : lang === "ar" ? (ORD.ar[n] || String(n)) : n + "ەم";
  const pname = (p) => (lang !== "en" && p["name_" + lang]) || p.name;
  const preward = (p) => (lang !== "en" && p["reward_" + lang]) || p.reward;
  const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } for (const k of kids) if (k != null) e.append(k); return e; };
  const fmtDate = (t, o) => new Date(t).toLocaleDateString(LOC[lang], o || { day: "numeric", month: "long" });
  const ago = (t) => { if (!t) return tr("never"); const d0 = new Date(); d0.setHours(0, 0, 0, 0); if (t >= d0.getTime()) return tr("today"); if (t >= d0.getTime() - 864e5) return tr("yesterday"); return tr("daysAgo", { n: Math.ceil((d0.getTime() - t) / 864e5) }); };

  function setLang(l) {
    lang = T[l] ? l : "en";
    document.documentElement.lang = lang === "ku" ? "ckb" : lang;
    document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
    document.body.classList.toggle("rtl", lang !== "en");
    for (const b of document.querySelectorAll(".langs button")) b.setAttribute("aria-pressed", b.dataset.lang === lang);
    for (const n of document.querySelectorAll("[data-t]")) n.textContent = tr(n.dataset.t);
    try { localStorage.setItem("amed-lang", lang); } catch (_) {}
    renderStatic();
    if (lastEntry) showCards(lastEntry, false);
    else if (!$("result").hidden) showNotFound();
  }

  function renderStatic() {
    const progs = DATA ? DATA.programs : [{ id: "drinks", name: "Drinks", target: 7, reward: "free drink", name_ar: "المشروبات", reward_ar: "مشروب مجاني", name_ku: "خواردنەوە", reward_ku: "خواردنەوەیەکی بێبەرامبەر" }];
    const t = progs[0].target, same = progs.every((p) => p.target === t);
    const h = $("heroTitle"); h.textContent = "";
    h.append(tr("heroA", { n: t }), el("em", { text: tr("heroB", { nth: ordinal(t + 1) }) }));
    const names = progs.map((p) => lang === "en" ? p.name.toLowerCase() : pname(p));
    $("heroSub").textContent = tr("heroSub", { list: names.length > 1 ? names.slice(0, -1).join("، ") + tr("or") + names.slice(-1) : names[0] });
    $("stepN").textContent = same ? t + 1 : "★"; $("s3t").textContent = tr("s3t", { nth: ordinal(t + 1) });
    const box = $("offers"); box.textContent = "";
    for (const p of progs) {
      const strip = el("div", { class: "strip", "aria-hidden": "true" });
      for (let i = 0; i < p.target; i++) { const s = el("i"); s.innerHTML = iconFor(p); strip.append(s); }
      strip.append(el("span", { class: "plus", text: "=" }), el("i", { class: "free", text: "FREE" }));
      box.append(el("div", { class: "offer" }, el("div", { class: "t" }, el("h4", { text: pname(p) }), el("span", { class: "eq", text: tr("plusFree", { n: p.target }) })), strip, el("p", { text: tr("collect", { n: p.target, reward: preward(p) }) })));
    }
    const lv = (DATA && DATA.levels) || [];
    $("levelsSec").hidden = !lv.length; const lb = $("levels"); lb.textContent = "";
    for (const l of [...lv].sort((a, b) => a.visits - b.visits)) lb.append(el("div", {}, el("b", { text: l.name }), el("span", { text: tr("levelRow", { n: l.visits }) + (l.perk ? " · " + l.perk : "") })));
    if (DATA && DATA.updated) { const d = new Date(DATA.updated); $("foot").textContent = tr("updated", { date: fmtDate(DATA.updated, { day: "numeric", month: "short" }), time: d.toLocaleTimeString(LOC[lang], { hour: "2-digit", minute: "2-digit" }) }); }
  }

  function norm(raw) {
    let d = String(raw || "").replace(/[٠-٩]/g, (c) => "٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/[۰-۹]/g, (c) => "۰۱۲۳۴۵۶۷۸۹".indexOf(c)).replace(/\D/g, "");
    if (d.startsWith("00")) d = d.slice(2);
    const cc = (DATA && DATA.countryCode) || "964";
    if (cc && d.startsWith(cc) && d.length > 10) d = d.slice(cc.length);
    return d.replace(/^0+/, "");
  }
  async function hash(d, pin) {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode("amed-cafe:" + d), iterations: 100000 }, key, 128);
    return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  function showCards(entry, scroll = true) {
    lastEntry = entry;
    const r = $("result"); r.textContent = ""; r.hidden = false;
    r.append(el("p", { class: "hello", text: tr("hello") }));
    const year = String(new Date().getFullYear());
    const sum = el("div", { class: "summary" },
      el("div", { class: "facts" },
        el("div", {}, el("span", { text: tr("visits") }), el("b", { text: String(entry.v || 0) })),
        el("div", {}, el("span", { text: tr("thisYear") }), el("b", { text: String((entry.yv || {})[year] || 0) })),
        el("div", {}, el("span", { text: tr("lastVisit") }), el("b", { text: ago(entry.lv), style: "font-size:1.05rem" }))));
    const levels = [...((DATA && DATA.levels) || [])].sort((a, b) => a.visits - b.visits);
    if (levels.length) {
      let cur = null; for (const l of levels) if ((entry.v || 0) >= l.visits) cur = l;
      const next = levels.find((l) => (entry.v || 0) < l.visits);
      const vip = el("div", { class: "vip" });
      if (cur) vip.append(el("span", { class: "badge", text: tr("levelIs", { level: cur.name }) }));
      if (next) vip.append(el("small", { text: tr("toNext", { n: next.visits - (entry.v || 0), level: next.name }) }));
      sum.append(vip);
      if (next) { const base = cur ? cur.visits : 0, pct = Math.max(4, Math.min(100, ((entry.v || 0) - base) / (next.visits - base) * 100)); const m = el("div", { class: "meter" }); const i = el("i"); i.style.width = pct + "%"; m.append(i); sum.append(m); }
      if (cur && cur.perk) sum.append(el("small", { text: tr("perk", { perk: cur.perk }), style: "color:var(--muted)" }));
    }
    r.append(sum);
    for (const p of DATA.programs.filter((q) => entry.p && entry.p[q.id])) {
      const [stamps = 0, rewards = 0, redeemed = 0, total = 0, exp = 0] = entry.p[p.id];
      const s = Math.min(stamps, p.target), left = p.target - s;
      const grid = el("div", { class: "stamps" });
      const cols = p.target + 1 <= 6 ? p.target + 1 : (p.target + 1) % 4 === 0 ? 4 : 5;
      grid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0,1fr))";
      for (let i = 0; i < p.target; i++) { const d = el("div", { class: "slot" }); if (i < s) { d.classList.add("on"); d.innerHTML = iconFor(p); d.style.transform = "rotate(" + (((i * 37) % 23) - 11) + "deg)"; } else d.textContent = i + 1; grid.append(d); }
      grid.append(el("div", { class: "slot reward" + (rewards > 0 ? " lit" : ""), text: "FREE" }));
      const c = el("article", { class: "card" },
        el("div", { class: "head" }, el("h2", { text: pname(p) }), el("span", { class: "rule", text: tr("rule", { n: p.target, nth: ordinal(p.target + 1) }) })),
        grid,
        el("div", { class: "line" }, el("strong", { text: tr("more", { n: left }) }), tr("toGo", { reward: preward(p), s, n: p.target })));
      if (rewards > 0) c.append(el("span", { class: "ready", text: (rewards > 1 ? tr("readyN", { k: rewards, reward: preward(p) }) : tr("ready1", { reward: preward(p) })) + (exp ? tr("useBy", { date: fmtDate(exp) }) : "") }));
      c.append(el("div", { class: "tally" }, el("div", {}, el("b", { text: String(total) }), tr("stamped")), el("div", {}, el("b", { text: String(redeemed) }), tr("collected"))));
      r.append(c);
    }
    if (entry.code) {
      const q = el("div", { class: "qr" });
      r.append(el("div", { class: "myqr" }, q, el("div", { class: "txt" }, el("b", { text: tr("qrTitle") }), el("code", { text: entry.code }), el("p", { text: tr("qrText") }))));
      try { new QRCode(q, { text: ((DATA && DATA.staffLink) || "") + "#m-" + entry.code, width: 120, height: 120, colorDark: "#1C231E", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.M }); } catch (_) { q.remove(); }
    }
    r.append(el("button", { type: "button", class: "again", text: tr("again"), onclick: () => { lastEntry = null; r.hidden = true; $("phone").value = ""; $("pin").value = ""; $("phone").focus(); } }));
    if (scroll) r.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }

  function showNotFound() {
    lastEntry = null;
    const r = $("result"); r.textContent = ""; r.hidden = false;
    r.append(el("div", { class: "notfound" }, el("h2", { text: tr("nfTitle") }), el("p", { text: tr("nfText") })));
  }

  $("checkForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("err"), fail = (k) => { err.textContent = tr(k); err.hidden = false; };
    err.hidden = true;
    const d = norm($("phone").value), pin = norm("1" + $("pin").value).slice(1);
    if (d.length < 6) return fail("needPhone");
    if (pin.length !== 4) return fail("needPin");
    if (!loaded) return fail("loading");
    try { const entry = DATA.cards[await hash(d, pin)]; entry ? showCards(entry) : showNotFound(); }
    catch (_) { fail("noCrypto"); }
  });
  for (const b of document.querySelectorAll(".langs button")) b.addEventListener("click", () => setLang(b.dataset.lang));

  let start = (location.hash || "").replace("#", "");
  if (!T[start]) { try { start = localStorage.getItem("amed-lang") || ""; } catch (_) { start = ""; } }
  if (!T[start]) { const nl = (navigator.language || "").toLowerCase(); start = nl.startsWith("ar") ? "ar" : nl.startsWith("en") ? "en" : "ku"; }
  setLang(start);
  window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (T[h]) setLang(h); });

  fetch("data.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw 0; return r.json(); })
    .then((d) => { DATA = d; loaded = true; renderStatic(); })
    .catch(() => { const err = $("err"); err.textContent = tr("noLoad"); err.hidden = false; });
})();
</script>
