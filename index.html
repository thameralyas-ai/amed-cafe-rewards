<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // Members who signed in to their loyalty card go straight to it (old links, printed QR codes and
  // old Home Screen icons all land here). Add ?home to the address to see the website instead.
  try { if (localStorage.getItem("amed-session") && !/[?&]home\b/.test(location.search)) location.replace("card/" + location.hash); } catch (_) {}
</script>
<title>Amed Cafe · your comfort space</title>
<meta name="description" content="Amed Cafe: coffee, cold drinks and premium shisha. Open every day 8:00 AM – 1:00 AM. Buy 7, the 8th is free with the Amed loyalty card.">
<meta property="og:title" content="Amed Cafe · your comfort space">
<meta property="og:description" content="Coffee, drinks and premium shisha. Open every day 8:00 AM – 1:00 AM.">
<meta property="og:image" content="https://amedcaferest.com/card/icon-512.png">
<meta property="og:url" content="https://amedcaferest.com/">
<link rel="icon" href="card/icon-192.png">
<link rel="apple-touch-icon" href="card/icon-180.png">
<meta name="theme-color" content="#1C120D">
<link rel="stylesheet" href="vendor/lenis.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&family=Noto+Naskh+Arabic:wght@500;600&family=Noto+Sans+Arabic:wght@300;400;500&display=swap">
<style>
/* Espresso & Gold: espresso background, latte text, gold accents (Thamir chose sample B). */
:root {
  --bg: #1C120D; --surface: #2A1C15; --ink: #F3E9DC; --muted: #C4B09C; --gold: #D4A373; --gold2: #E3B27D; --line: #3F2D23;
  --serif: "Cormorant Garamond", Georgia, serif; --sans: Jost, system-ui, sans-serif;
  color-scheme: dark;
}
.rtl { --serif: "Noto Naskh Arabic", "Cormorant Garamond", serif; --sans: "Noto Sans Arabic", Jost, system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font: 300 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
.kicker { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
.rtl .kicker { letter-spacing: 0; font-size: 14px; font-weight: 500; }
.latin { font-family: "Cormorant Garamond", Georgia, serif; }

/* Header */
header { position: absolute; top: 0; left: 0; right: 0; z-index: 5; }
header .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
.logo { display: block; width: 96px; height: 44px; background: url(logo-gold.png) center/contain no-repeat; }
.langs { display: flex; gap: 6px; }
.langs button { border: 0; background: none; padding: 4px; border-radius: 6px; opacity: .5; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 1.5px var(--gold); }
.flag { width: 28px; height: 19px; display: block; border-radius: 3px; }

/* Hero */
/* Hero light: still gradients only. The moving spotlight beam and the Light Rays canvas were removed
   because one of them drew a stray dotted line on iPhone. */
.hero { position: relative; padding: 100px 0 0; text-align: center; overflow: hidden; --glow-x: 50%;
  background: radial-gradient(38% 34% at var(--glow-x) 0%, #E3B27D2E, transparent 100%), radial-gradient(120% 60% at 50% 0%, #2A1B13, var(--bg)); }
/* Spotlight Stage (Thamir chose animated sample 2) */
.hero .wrap { position: relative; }
header { z-index: 6; }
.intro { animation: rise 1s .15s both; }
.swap { display: inline-block; position: relative; height: 1.15em; vertical-align: bottom; overflow: hidden; min-width: 4.6em; text-align: inherit; }
.rtl .swap { height: 1.5em; }
.swap b { position: absolute; left: 0; right: 0; font-weight: 500; font-style: italic; color: var(--gold2); transform: translateY(110%); opacity: 0; transition: transform .7s cubic-bezier(.2,.7,.2,1), opacity .7s; }
.rtl .swap b { font-style: normal; }
.swap b.on { transform: none; opacity: 1; } .swap b.out { transform: translateY(-110%); opacity: 0; }
.stage { position: relative; height: 330px; max-width: 360px; margin: 6px auto 0; animation: rise 1.2s .5s both; }
.ring { position: absolute; left: 50%; bottom: 22px; width: 300px; height: 64px; margin-left: -150px; border-radius: 50%; border: 1px solid #D4A37388;
  background: radial-gradient(closest-side, #D4A37333, transparent); box-shadow: 0 0 40px #D4A37333, inset 0 0 30px #D4A37322; }
/* The light running round the ring: a short dash moving along an SVG oval drawn exactly on the ring.
   No spinning shapes, no blur filter (those caused a stray line on iPhone). */
.ring svg { position: absolute; left: -1px; top: -1px; width: calc(100% + 2px); height: calc(100% + 2px); overflow: visible; }
.ring path { fill: none; stroke: #FFE2B8; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 14 86; animation: ringrun 4s linear infinite; }
.ring path.halo { stroke-width: 6; opacity: .22; } .ring path.core { stroke-width: 1.6; }
@keyframes ringrun { to { stroke-dashoffset: -100; } }
.stage img { position: absolute; left: 50%; bottom: 46px; height: 250px; width: auto; transform-origin: 50% 100%; will-change: transform, filter; }
.dots { display: flex; justify-content: center; gap: 8px; margin-top: -4px; direction: ltr; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: #D4A37355; transition: background .4s, width .4s; }
.dots i.on { background: var(--gold2); width: 18px; }
.sname { height: 22px; margin-top: 8px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); transition: opacity .4s; }
.rtl .sname { letter-spacing: 0; font-size: 14px; }
.hero .t2 { animation: rise 1s .9s both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.btn.pri { animation: glow 2.6s 2s infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 8px #E3B27D00, 0 0 26px #E3B27D66; } }
/* Motion layer (js/motion.js): Lenis smooth scroll and Star Border on the main button (Light Rays removed: stray line on iPhone). */
html.lenis { scroll-behavior: auto; }
.star-border { position: relative; isolation: isolate; }
.star-border__light { position: absolute; top: -40px; left: -40px; width: calc(100% + 80px); height: calc(100% + 80px); pointer-events: none; z-index: -1; }
.btn.pri.star-border { animation: none; }
.bw { display: inline-block; }
/* Sections fade up as they scroll into view */
.js .rv { opacity: 0; transform: translateY(30px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
.js .rv.in { opacity: 1; transform: none; }
/* Reduce Motion: still animated (Thamir asked), but calmer: no spotlight sweep or button pulse, slower ring, fade without sliding */
@media (prefers-reduced-motion: reduce) { .btn.pri { animation: none; } .ring path { animation-duration: 12s; } .js .rv, .intro, .stage, .hero .t2, .swap b { transform: none !important; } }
.hero h1 { font-size: 46px; line-height: 1.05; margin: 12px 0 10px; }
.rtl .hero h1 { font-size: 38px; line-height: 1.35; }
.hero h1 i { color: var(--gold2); font-family: "Cormorant Garamond", Georgia, serif; }
.hero p { color: var(--muted); max-width: 30ch; margin: 0 auto; }
.cta { display: flex; flex-direction: column; gap: 10px; margin: 26px auto 0; max-width: 340px; }
.btn { display: block; padding: 15px; border-radius: 99px; text-decoration: none; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; text-align: center; }
.rtl .btn { letter-spacing: 0; font-size: 15px; }
.btn.pri { background: linear-gradient(135deg, #E3B27D, #B98552); color: #1C120D; }
.btn.sec { border: 1px solid #D4A37366; color: var(--gold2); }
.status { font-size: 14px; color: var(--muted); }
.status b { color: var(--ink); font-weight: 500; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #6FCF8A; margin-inline-end: 7px; box-shadow: 0 0 8px #6FCF8A; vertical-align: middle; }
.dot.off { background: #E3786E; box-shadow: 0 0 8px #E3786E; }

/* Sections */
section { padding: 56px 0 0; scroll-margin-top: 10px; }
.head { text-align: center; margin-bottom: 22px; }
.head .kicker { display: block; }
.head h2 { font-size: 36px; margin-top: 4px; line-height: 1.2; }
.rtl .head h2 { font-size: 30px; }
.orn { display: block; width: 60px; height: 1px; background: var(--gold); margin: 12px auto 0; position: relative; }
.orn::after { content: ""; position: absolute; left: 50%; top: -3px; width: 7px; height: 7px; background: var(--gold); transform: translateX(-50%) rotate(45deg); }
.note { text-align: center; font-size: 13px; color: var(--muted); margin-top: 8px; }

/* Menu */
.tabs { display: flex; gap: 6px; justify-content: safe center; overflow-x: auto; scrollbar-width: none; margin: 0 -20px 14px; padding: 0 20px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { font: inherit; font-size: 13px; white-space: nowrap; flex: none; color: var(--muted); background: #ffffff0a; border: 1px solid var(--line); padding: 7px 12px; border-radius: 99px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: #1C120D; background: var(--gold); border-color: var(--gold); font-weight: 500; }
.scroller { display: flex; align-items: flex-start; gap: 14px; overflow-x: auto; overflow-y: hidden; transition: height .25s ease; scroll-snap-type: x mandatory; margin: 0 -20px; padding: 4px 20px 10px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.mc { flex: 0 0 82%; scroll-snap-align: center; background: linear-gradient(180deg, #2E1F17, #241812); border: 1px solid var(--line); border-radius: 22px; padding: 20px; }
.mc h3 { font-size: 28px; color: var(--gold2); margin-bottom: 6px; }
.rtl .mc h3 { font-size: 24px; }
.mc .shot { min-height: 120px; display: grid; place-items: center; margin-bottom: 4px; }
.mc .shot img { height: 120px; filter: drop-shadow(0 10px 12px #000a); }
/* Shisha smoke (Thamir chose "Soft puffs"): puffs rise from the bowl at the top of the shisha photo. */
.smoke-wrap { position: relative; display: inline-block; }
.smoke-wrap { margin-top: 64px; }
.smoke-wrap img { display: block; }
.smoke { position: absolute; left: 35%; top: 2px; width: 0; height: 0; pointer-events: none; }
.smoke i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, #fffd 0%, #fff8 40%, #fff0 72%); filter: blur(2px); opacity: 0; animation: puff 4.2s linear infinite; }
.smoke i:nth-child(2) { animation-delay: -1.05s; --dx: -10px; } .smoke i:nth-child(3) { animation-delay: -2.1s; --dx: 8px; } .smoke i:nth-child(4) { animation-delay: -3.15s; --dx: -4px; }
@keyframes puff { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 12% { opacity: .9; } 50% { transform: translate(calc(var(--dx, 6px) * .6), -38px) scale(1.6); opacity: .6; } 100% { transform: translate(var(--dx, 6px), -80px) scale(2.8); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .smoke i { animation-duration: 12s; } }
/* "From our bar": swipe row of real drink photos (menu.json gallery), not tied to single items. */
.barw { margin: 6px 0 16px; }
.barh { font-family: var(--serif); font-weight: 500; font-size: 24px; color: var(--gold2); line-height: 1.2; margin: 0 0 10px; }
.bar { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -20px; padding: 0 20px 6px; }
.bar::-webkit-scrollbar { display: none; }
.bar a { flex: none; width: 128px; scroll-snap-align: start; text-decoration: none; color: var(--ink); font-size: 13px; line-height: 1.3; text-align: center; }
.bar img { display: block; width: 128px; height: 164px; object-fit: cover; border-radius: 16px; margin-bottom: 6px; border: 1px solid var(--line); background: #2A1C15; }
/* "Best seller" badge on an item (it.popular) */
.badge.pop { background: none; color: var(--gold2); box-shadow: inset 0 0 0 1px var(--gold); }
/* Shisha as a real photo: smoke starts at c.smoke (% of the photo) and stays inside the rounded photo */
.shot.ph .smoke-wrap { margin-top: 0; overflow: hidden; border-radius: 18px; box-shadow: 0 10px 24px #0008; }
.shot.ph img { height: 250px; width: auto; filter: none; }
.li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #3F2D2399; font-size: 15px; }
.li:last-child { border: 0; }
.li .p { color: var(--gold2); font-weight: 400; white-space: nowrap; direction: ltr; }
.li .p small { font-size: 11px; color: var(--muted); margin-inline-start: 3px; }
.li .sub { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
/* Menu item hover (Thamir chose samples 1 + 3): soft gold glow with a gold bar at the start, name bold and gold, price a bit bigger.
   Mouse: on hover. Phones: shows while the item is touched. */
.li { position: relative; border-radius: 10px; margin-inline: -10px; padding-inline: 10px; transition: background .25s ease, box-shadow .25s ease; }
.li::before { content: ""; position: absolute; inset-inline-start: 0; top: 22%; bottom: 22%; width: 3px; border-radius: 3px; background: var(--gold); transform: scaleY(0); transition: transform .25s ease; }
.li > span:first-child { transition: color .25s ease; }
.li .p { display: inline-block; transition: transform .25s ease; }
.li:active { background: #D4A3731F; box-shadow: 0 0 0 1px #D4A37344; }
.li:active::before { transform: scaleY(1); }
.li:active > span:first-child { font-weight: 500; color: var(--gold2); }
.li:active .p { transform: scale(1.12); }
@media (hover: hover) {
  .li:hover { background: #D4A3731F; box-shadow: 0 0 0 1px #D4A37344; }
  .li:hover::before { transform: scaleY(1); }
  .li:hover > span:first-child { font-weight: 500; color: var(--gold2); }
  .li:hover .p { transform: scale(1.12); }
}
@media (prefers-reduced-motion: reduce) { .li, .li::before, .li .p, .li > span:first-child { transition: none; } }

/* Rewards */
.rewards { display: grid; gap: 14px; }
.reward { border: 1px solid #D4A37355; border-radius: 24px; padding: 26px 22px; text-align: center; background: radial-gradient(80% 60% at 50% 0%, #6F4E3744, transparent); }
.reward .big { font-family: "Cormorant Garamond", serif; font-variant-numeric: lining-nums; font-size: 64px; line-height: 1; color: var(--gold2); direction: ltr; }
.reward h3 { font-size: 26px; margin: 8px 0 4px; }
.reward p { color: var(--muted); }
.progs { display: grid; gap: 10px; margin: 18px 0; text-align: start; }
.prog { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #ffffff08; border-radius: 14px; padding: 10px 14px; }
.prog b { font-weight: 500; }
.stamps { display: flex; gap: 5px; direction: ltr; }
.stamps i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #D4A37388; }
.stamps i.free { border: 1.5px dashed var(--gold2); }
.tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 16px; }
.tiers div { padding: 9px 2px; border-radius: 10px; background: #ffffff0d; }
.tiers b { display: block; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
.rtl .tiers b { letter-spacing: 0; text-transform: none; font-size: 14px; }
.tiers span { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; margin-top: 3px; }
.tiers .t1 b { color: #C98F6B; } .tiers .t2 b { color: #D9DEE3; } .tiers .t3 b { color: var(--gold2); } .tiers .t4 b { color: #B9C7D6; }
.reward .btn { margin: 20px auto 0; max-width: 300px; }

/* Events */
.tl { border-inline-start: 1px solid var(--gold); margin-inline-start: 8px; padding-inline-start: 20px; }
.ev { position: relative; padding-bottom: 22px; }
.ev::before { content: ""; position: absolute; inset-inline-start: -25px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); }
.ev small { color: var(--gold); font-size: 13px; }
.ev h3 { font-size: 24px; line-height: 1.3; }
.ev p { color: var(--muted); font-size: 14px; }
.empty { text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 18px; padding: 22px; }

/* Gallery */
/* Real photos and a short video of the cafe (media/space/). Wide photo on top, three tall tiles below. */
/* "The space": Circular Carousel (js/carousel.js). Photos black and white; colour on hover (computer) or tap (phone). */
.cc { position: relative; height: 380px; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: grab; outline: none; }
.cc[data-dragging] { cursor: grabbing; }
.cc:focus-visible { box-shadow: inset 0 0 0 1px #D4A37399; border-radius: 14px; }
.cc-view { position: absolute; inset: 0; }
.cc-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .45s; }
.cc[data-ready] .cc-stage { opacity: 1; }
.cc-camera, .cc-ring, .cc-card { width: 0; height: 0; transform-style: preserve-3d; }
.cc-camera { position: relative; }
.cc-ring, .cc-card { position: absolute; left: 0; top: 0; }
.cc-face { position: absolute; overflow: hidden; border-radius: 14px; background: #2A1C15; backface-visibility: hidden; -webkit-backface-visibility: hidden; outline: 1px solid transparent; }
.cc-face img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; filter: grayscale(1); transition: filter .45s; }
.cc-card.on .cc-face img { filter: none; }
@media (hover: hover) { .cc-card:hover .cc-face img { filter: none; } }
.cc-shade, .cc-inner { position: absolute; inset: 0; pointer-events: none; }
.cc-shade { background: #1C120D; opacity: var(--cc-depth, 0); }
.cc-inner { background: #000; }
.cc-play { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: #1C120DB3; border: 1px solid #FFE2B8AA; display: grid; place-items: center; pointer-events: none; }
.cc-play::before { content: ""; margin-left: 4px; border-style: solid; border-width: 7px 0 7px 12px; border-color: transparent transparent transparent #FFE2B8; }
.cc-hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 6px; }
@media (min-width: 900px) { .cc { height: 400px; } }
.lb { position: fixed; inset: 0; z-index: 50; background: #0B0705F2; display: none; align-items: center; justify-content: center; padding: calc(56px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom)); }
.lb.on { display: flex; }
.lb img, .lb video { max-width: 100%; max-height: 100%; border-radius: 12px; display: block; }
.lb .lbs { max-height: 100%; overflow-y: auto; display: grid; gap: 12px; max-width: 560px; -webkit-overflow-scrolling: touch; }
.lb .lbs img { max-height: none; width: 100%; }
.lb .x { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #D4A37399; background: #241812; color: var(--gold2); font-size: 24px; line-height: 1; cursor: pointer; }
.rtl .lb .x { right: auto; left: 14px; }

/* Flavour tiles (e.g. Asary): fruit picture + name, 3 per row. */
.flv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 8px; }
.flv div { text-align: center; font-size: 12.5px; line-height: 1.3; color: var(--ink); }
.flv img { display: block; width: 100%; max-width: 76px; aspect-ratio: 1; object-fit: cover; margin: 0 auto 5px; border-radius: 14px; background: #F3E9DC; }
@media (min-width: 640px) { .np .flv { grid-template-columns: repeat(9, 1fr); } }
/* New products: menu categories marked "new" in menu.json get a feature card above the menu. */
.newp { display: grid; gap: 14px; }
.np { background: linear-gradient(180deg, #2E1F17, #241812); border: 1px solid #D4A37366; border-radius: 22px; overflow: hidden; }
.np .bn { display: block; width: 100%; aspect-ratio: 20 / 7; object-fit: cover; background: #F3E9DC; }
.np .bd { padding: 16px 20px 20px; }
.np h3 { font-size: 30px; line-height: 1.15; color: var(--gold2); } .rtl .np h3 { font-size: 25px; }
.np p { color: var(--muted); font-size: 14.5px; margin: 6px 0 4px; }
.np .pr { color: var(--ink); font-size: 15px; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.np .acts { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.np .acts .btn { flex: 1 1 140px; padding: 12px; }
.badge { display: inline-block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; color: #1C120D; background: var(--gold); padding: 2px 8px; border-radius: 99px; vertical-align: middle; margin-inline-start: 6px; }
.rtl .badge { letter-spacing: 0; font-size: 12px; }
.mc .bn { display: block; width: calc(100% + 40px); margin: -20px -20px 12px; aspect-ratio: 20 / 7; object-fit: cover; border-radius: 22px 22px 0 0; }
.mc .desc { color: var(--muted); font-size: 13px; line-height: 1.5; margin-bottom: 4px; }
.mc { scroll-margin-top: 20px; }

/* ☰ navigation (Thamir chose option 3): a round button that stays at the top corner while scrolling,
   opening a full-screen list. "Menu" opens the QR menu page (menu/). */
.navbtn { position: fixed; z-index: 30; top: calc(12px + env(safe-area-inset-top)); right: max(16px, calc((100vw - 1080px) / 2 + 16px));
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid #D4A37399; background: #1C120DCC; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--gold2); }
.rtl .navbtn { right: auto; left: max(16px, calc((100vw - 1080px) / 2 + 16px)); }
.navbtn i, .navbtn i::before, .navbtn i::after { display: block; width: 18px; height: 1.5px; background: currentColor; border-radius: 2px; position: relative; transition: transform .3s, background .3s; }

.navbtn i::before { top: -6px; } .navbtn i::after { top: 6px; }

.r:last-child { border: 0; }
.r > span { color: var(--muted); font-size: 14px; white-space: nowrap; }

  function openLb(t) {
    let lb = $("lb");
    if (!lb) {
      lb = el("div", { id: "lb", class: "lb", role: "dialog", "aria-modal": "true", "data-lenis-prevent": "", onclick: (e) => { if (e.target === lb) closeLb(); } });
      document.body.append(lb);
      addEventListener("keydown", (e) => { if (e.key === "Escape") closeLb(); });
    }
    lb.textContent = "";
    lb.append(el("button", { type: "button", class: "x", "aria-label": tr("close"), onclick: closeLb }, "×"),
      t.video ? el("video", { src: t.video, poster: t.poster, controls: "", autoplay: "", playsinline: "" })
        : t.more ? el("div", { class: "lbs" }, ...t.more.map((src) => el("img", { src, alt: tr(t.alt) })))
        : el("img", { src: t.src, alt: tr(t.alt) }));
    lb.classList.add("on");
    document.body.style.overflow = "hidden"; if (window.AmedMotion) AmedMotion.stop();
    lb.querySelector(".x").focus();
  }
  function closeLb() {
    const lb = $("lb"); if (!lb) return;
    lb.classList.remove("on"); lb.textContent = ""; document.body.style.overflow = ""; if (window.AmedMotion) AmedMotion.start();
  }

  function renderInfo() {
    // Social media: a row of gold icons (only the accounts that are filled in).
    const wa0 = (CONTACT.whatsapp || (DATA && DATA.contact && DATA.contact.wa) || "").replace(/\D/g, "");
    const soc = $("social"); soc.textContent = "";
    for (const [key, icon, href] of [
      ["whatsapp", "wa", wa0 && "https://wa.me/" + wa0],
      ["instagram", "ig", CONTACT.instagram && "https://instagram.com/" + CONTACT.instagram],
      ["tiktok", "tt", CONTACT.tiktok && "https://www.tiktok.com/@" + CONTACT.tiktok],
      ["snapchat", "sc", CONTACT.snapchat],
    ]) {
      if (!href) continue;
      const a = el("a", { href, target: "_blank", rel: "noopener", "aria-label": tr(key) }, el("span", { class: "ic" }), tr(key));
      a.firstChild.innerHTML = '<svg aria-hidden="true"><use href="#' + icon + '"/></svg>';
      soc.append(a);
    }
    const box = $("info"); box.textContent = "";
    const soon = () => el("span", { class: "soon", text: tr("soon") });
    const link = (href, text, ltr) => el("a", { href, target: "_blank", rel: "noopener", class: ltr ? "ltr" : "" }, text);
    const row = (label, val) => box.append(el("div", { class: "r" }, el("span", { text: label }), val));
    row(tr("hours"), el("b", { text: tr("everyDayHours") }));
    const addr = pick(CONTACT.address);
    row(tr("location"), CONTACT.maps ? link(CONTACT.maps, addr || tr("openMaps")) : addr ? el("b", { text: addr }) : soon());
    row(tr("phone"), CONTACT.phone ? el("a", { href: "tel:" + CONTACT.phone.replace(/\D/g, "").replace(/^0/, "+964"), class: "ltr" }, CONTACT.phone) : soon());
    row(tr("review"), link(CONTACT.review, tr("reviewLink")));
  }

  // Headline: "Your evening of" + a word that changes every 2.2 s (coffee, shisha, comfort).
  let swapTimer = null;
  function buildHeadline() {
    const h = $("h1"); h.textContent = "";
    const sw = el("span", { class: "swap" });
    T[lang].words.forEach((w, i) => sw.append(el("b", { class: i ? "" : "on", text: w })));
    // Headline words appear with Blur Text (each word separately so Arabic letters stay joined).
    const words = tr("h1a").split(" ").filter(Boolean);
    words.forEach((w, i) => { h.append(el("span", { class: "bw", text: w })); if (i < words.length - 1) h.append(" "); });
    h.append(el("br"), sw);
    if (window.AmedMotion) AmedMotion.blurText([...h.querySelectorAll(".bw"), sw]);
    clearInterval(swapTimer);
    const bs = [...sw.children]; let i = 0;
    swapTimer = setInterval(() => { const a = bs[i]; a.classList.remove("on"); a.classList.add("out"); setTimeout(() => a.classList.remove("out"), 700); i = (i + 1) % bs.length; bs[i].classList.add("on"); }, REDUCED ? 3200 : 2200);
  }

  // Stage: the three shishas circle slowly; the one in front is large and bright. Pauses when off screen.
  let frontShisha = 0, flavourIdx = -1;
  // Under the stage: the flavours these shishas are served with (Thamir: only English and Royal),
  // taken from the menu so the names follow the language. Alternates each time a new shisha turns to the front.
  const STAGE_FLAVOURS = ["English mix", "Royal mix"];
  function stageLabel() {
    const cat = MENU && MENU.categories.find((c) => c.id === "shisha");
    const fl = cat ? STAGE_FLAVOURS.map((n) => cat.items.find((it) => it.name.en === n)).filter(Boolean) : [];
    if (!fl.length) return T[lang].shishas[frontShisha];
    return pick(fl[((flavourIdx % fl.length) + fl.length) % fl.length].name);
  }
  function startStage() {
    const st = $("stage"), im = [...st.querySelectorAll("img")], dots = [...document.querySelectorAll(".dots i")];
    let visible = true, t0 = performance.now(), paused = 0, last = t0;
    const place = (a) => {
      im.forEach((img, k) => {
        const th = a + k * (Math.PI * 2 / 3), z = (Math.cos(th) + 1) / 2, x = Math.sin(th) * (st.clientWidth > 400 ? 150 : 110);
        img.style.transform = "translateX(calc(-50% + " + x.toFixed(1) + "px)) scale(" + (0.62 + 0.38 * z).toFixed(3) + ")";
        img.style.zIndex = Math.round(z * 20);
        img.style.filter = "brightness(" + (0.55 + 0.45 * z).toFixed(2) + ") blur(" + ((1 - z) * 2.2).toFixed(2) + "px) drop-shadow(0 18px 18px #000a)";
      });
      const f = im.map((_, k) => Math.cos(a + k * (Math.PI * 2 / 3))).reduce((b, v, k, arr) => v > arr[b] ? k : b, 0);
      if (f !== frontShisha || !$("sname").textContent) {
        frontShisha = f; dots.forEach((d, k) => d.classList.toggle("on", k === f));
        flavourIdx++;
        const n = $("sname"); n.style.opacity = 0; setTimeout(() => { n.textContent = stageLabel(); n.style.opacity = 1; }, 200);
      }
    };
    const PERIOD = REDUCED ? 18000 : 9000; // one full turn; calmer with Reduce Motion
    new IntersectionObserver((es) => { visible = es[0].isIntersecting; }).observe(st);
    (function tick(now) {
      if (!visible || document.hidden) paused += now - last; else place(((now - t0 - paused) / PERIOD) * Math.PI * 2);
      last = now; requestAnimationFrame(tick);
    })(t0);
  }

  function setLang(l) {
    lang = T[l] ? l : "ku";
    document.documentElement.lang = lang === "ku" ? "ckb" : lang;
    document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
    document.body.classList.toggle("rtl", lang !== "en");
    for (const b of document.querySelectorAll(".langs button")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    for (const n of document.querySelectorAll("[data-t]")) n.textContent = tr(n.dataset.t);
    buildHeadline();
    if ($("sname").textContent) $("sname").textContent = stageLabel();
    $("cardBtn").href = "card/#" + lang;
    try { localStorage.setItem("amed-lang", lang); } catch (_) {}
    renderStatus(); renderMenu(); renderNew(); renderNav(); renderRewards(); renderEvents(); renderGallery(); renderInfo();
  }

  // Scroll reveal for the sections below the hero
  document.documentElement.classList.add("js");
  const revealIO = "IntersectionObserver" in window ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); revealIO.unobserve(e.target); } }), { threshold: 0.12 }) : null;
  const revealNodes = [...document.querySelectorAll("main .head, #newp, #scroller, .reward, #evList, #gal, #social, #info")];
  if (!(window.AmedMotion && AmedMotion.reveal(revealNodes))) // GSAP ScrollTrigger; old fade-up if it did not load
    revealNodes.forEach((n) => { n.classList.add("rv"); if (revealIO) revealIO.observe(n); else n.classList.add("in"); });
  if (window.AmedMotion) {
    AmedMotion.starBorder($("cardBtn"));
  }

  $("navBtn").addEventListener("click", () => setNav(!document.body.classList.contains("nav-open")));
  addEventListener("keydown", (e) => { if (e.key === "Escape" && document.body.classList.contains("nav-open")) setNav(false); });
  for (const b of document.querySelectorAll(".langs button")) b.addEventListener("click", () => { setLang(b.dataset.lang); history.replaceState(null, "", "#" + lang); });
  $("scroller").addEventListener("scroll", () => {
    const sc = $("scroller"), r = sc.getBoundingClientRect(), mid = r.left + r.width / 2;
    let best = 0, bd = 1e9;
    [...sc.children].forEach((c, i) => { const cr = c.getBoundingClientRect(), d = Math.abs(cr.left + cr.width / 2 - mid); if (d < bd) { bd = d; best = i; } });
    if (best !== activeCat) {
      activeCat = best; const tabs = $("tabs");
      [...tabs.children].forEach((b, i) => b.setAttribute("aria-selected", String(i === best)));
      if (tabs.children[best]) centerIn(tabs, tabs.children[best]);
      fitMenu();
    }
  }, { passive: true });
  window.addEventListener("resize", fitMenu);
  $("yr").textContent = new Date().getFullYear();

  let start = (location.hash || "").replace("#", "");
  if (!T[start]) { try { start = localStorage.getItem("amed-lang") || ""; } catch (_) { start = ""; } }
  if (!T[start]) { const nl = (navigator.language || "").toLowerCase(); start = nl.startsWith("ar") ? "ar" : nl.startsWith("en") ? "en" : "ku"; }
  setLang(start);
  window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (T[h]) setLang(h); });
  setInterval(renderStatus, 60000);
  startStage();

  fetch("menu.json", { cache: "no-cache" }).then((r) => r.ok ? r.json() : null).then((m) => { if (m) { MENU = m; renderMenu(); renderNew(); renderNav(); } }).catch(() => {});
  fetch("data.json", { cache: "no-store" }).then((r) => r.ok ? r.json() : null).then((d) => { if (d) { DATA = d; renderRewards(); renderEvents(); renderInfo(); } }).catch(() => {});
})();
</script>
</body>
</html>
