<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // Members who signed in to their loyalty card go straight to it (old links, printed QR codes and
  // old Home Screen icons all land here). Add ?home to the address to see the website instead.
  try { if (localStorage.getItem("amed-session") && !/[?&]home\b/.test(location.search)) location.replace("card/" + location.hash); } catch (_) {}
</script>
<title>Amed Cafe · your comfort space</title>
<meta name="description" content="Amed Cafe: coffee, cold drinks and premium shisha. Open every day 8:00 AM – 1:00 AM. Buy 7, the 8th is free with the Amed loyalty card.">
<meta property="og:title" content="Amed Cafe · your comfort space">
<meta property="og:description" content="Coffee, drinks and premium shisha. Open every day 8:00 AM – 1:00 AM.">
<meta property="og:image" content="https://amedcaferest.com/card/icon-512.png">
<meta property="og:url" content="https://amedcaferest.com/">
<link rel="icon" href="card/icon-192.png">
<link rel="apple-touch-icon" href="card/icon-180.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#130e0b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Apple-inspired redesign (.claude/skills/apple-design/SKILL.md), adapted to Amed Cafe:
   white space, system type, one focal drink per section, a warm caramel accent instead of gold.
   Dark mode uses the cafe's espresso brown. Spacing uses only 4 8 12 16 24 32 48 64 96 128 160. */
:root {
  --bg: #ffffff; --bg-alt: #f7f4f0; --text: #1d1d1f; --muted: #6e6e73; --hair: #d2d2d7;
  --accent: #9a6232; --accent-ink: #ffffff; --accent-soft: #9a62321a;
  --nav: rgb(255 255 255 / .72);
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
  --serif: "Cormorant Garamond", "Times New Roman", serif;
  --ease: cubic-bezier(.25, .1, .25, 1);
  --r: 20px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #130e0b; --bg-alt: #1f1813; --text: #f5f5f7; --muted: #a8a29c; --hair: #3b322c;
    --accent: #d9a066; --accent-ink: #1d1d1f; --accent-soft: #d9a0661f; --nav: rgb(19 14 11 / .72); }
}
.rtl { --sans: -apple-system, BlinkMacSystemFont, "Noto Sans Arabic", "Inter", "Helvetica Neue", Arial, sans-serif; }
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 400 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { display: block; max-width: 100%; }
a { color: inherit; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 768px) { .wrap { padding: 0 24px; } }
@media (min-width: 1200px) { .wrap { padding: 0 48px; } }
.ltr { direction: ltr; unicode-bidi: isolate; }
.eyebrow { display: block; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.rtl .eyebrow { letter-spacing: 0; font-size: 14px; }
h1, h2, h3 { font-weight: 600; }
.h2 { font-size: 32px; line-height: 1.2; letter-spacing: -.015em; }
.lead { font-size: 17px; color: var(--muted); max-width: 680px; }
.center { text-align: center; } .center .lead { margin-inline: auto; }
section { padding: 64px 0; scroll-margin-top: 48px; }
.alt { background: var(--bg-alt); }
@media (min-width: 768px) { .h2 { font-size: 48px; } .lead { font-size: 19px; } section { padding: 96px 0; } }
@media (min-width: 1200px) { .h2 { font-size: 56px; } .lead { font-size: 21px; } section { padding: 128px 0; } }

/* Buttons: pill primary + text link with a chevron */
.btn { display: inline-block; border-radius: 980px; padding: 12px 24px; font-size: 17px; font-weight: 400; text-decoration: none; background: var(--accent); color: var(--accent-ink); transition: filter .3s var(--ease); border: 0; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.more { color: var(--accent); text-decoration: none; font-size: 17px; background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; }
.more::after { content: " ›"; } .rtl .more::after { content: " ‹"; }
.more:hover { text-decoration: underline; }
.ctas { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: center; margin-top: 32px; }

/* Nav: slim, sticky, translucent */
.gn { position: sticky; top: 0; z-index: 30; height: 48px; background: var(--nav); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid color-mix(in srgb, var(--hair) 60%, transparent); }
.gn .wrap { height: 48px; display: flex; align-items: center; gap: 24px; }
.logo { display: block; width: 72px; height: 32px; flex: none; background: url(logo.png) center/contain no-repeat; }
@media (prefers-color-scheme: dark) { .logo { background-image: url(logo-gold.png); } }
.gn .links { display: none; gap: 32px; font-size: 12px; margin-inline-start: auto; }
.gn .links a { text-decoration: none; color: var(--text); opacity: .8; } .gn .links a:hover { opacity: 1; }
.rtl .gn .links { font-size: 14px; }
.langs { display: flex; gap: 4px; margin-inline-start: auto; }
.langs button { border: 0; background: none; padding: 4px; border-radius: 4px; opacity: .45; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 1px var(--accent); }
.flag { width: 20px; height: 14px; display: block; border-radius: 2px; }
.navbtn { width: 32px; height: 32px; border: 0; background: none; color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; }
.navbtn i, .navbtn i::before { display: block; width: 18px; height: 1.5px; background: currentColor; border-radius: 2px; position: relative; transition: transform .3s var(--ease); }
.navbtn i { background: none; } .navbtn i::before, .navbtn i::after { content: ""; position: absolute; left: 0; width: 18px; height: 1.5px; background: currentColor; border-radius: 2px; transition: transform .3s var(--ease); }
.navbtn i::before { top: -4px; } .navbtn i::after { top: 4px; }
.nav-open .navbtn i::before { transform: translateY(4px) rotate(45deg); } .nav-open .navbtn i::after { transform: translateY(-4px) rotate(-45deg); }
@media (min-width: 1024px) { .gn .links { display: flex; } .langs { margin-inline-start: 0; } .navbtn { display: none; } }
.navp { position: fixed; inset: 48px 0 0; z-index: 29; background: var(--bg); overflow-y: auto; padding: 32px 32px calc(48px + env(safe-area-inset-bottom)); opacity: 0; visibility: hidden; transition: opacity .3s var(--ease), visibility 0s .3s; }
.nav-open .navp { opacity: 1; visibility: visible; transition: opacity .3s var(--ease); }
.navp ul { list-style: none; padding: 0; max-width: 680px; margin: 0 auto; }
.navp li { opacity: 0; transform: translateY(-8px); transition: opacity .4s var(--ease), transform .4s var(--ease); transition-delay: calc(var(--i) * 40ms); }
.nav-open .navp li { opacity: 1; transform: none; }
.navp a { display: block; padding: 8px 0; text-decoration: none; color: var(--text); font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
.navp small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.navp .ncard { margin-top: 32px; } .navp .ncard a { font-size: 17px; font-weight: 400; display: inline-block; padding: 12px 24px; color: var(--accent-ink); }
.navp .hrs { margin-top: 24px; font-size: 14px; color: var(--muted); }

/* Hero: eyebrow, headline, tagline, one focal drink, two actions */
.hero { text-align: center; padding: 48px 0 64px; }
.hero h1 { font-size: 40px; line-height: 1.1; letter-spacing: -.02em; max-width: 14ch; margin: 0 auto; }
.rtl .hero h1 { line-height: 1.3; }
.swap { display: inline-grid; } .swap b { grid-area: 1 / 1; font-weight: 600; color: var(--accent); opacity: 0; transition: opacity .6s var(--ease); }
.swap b.on { opacity: 1; }
.hero .lead { margin: 16px auto 0; max-width: 34ch; }
.status { margin-top: 12px; font-size: 14px; color: var(--muted); }
.status b { font-weight: 500; color: var(--text); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34a853; margin-inline-end: 8px; vertical-align: 1px; }
.dot.off { background: #d9534f; }
.hero figure { margin: 48px auto 0; max-width: 560px; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--bg-alt); }
.hero figure img { width: 100%; height: 100%; object-fit: cover; will-change: transform; }
@media (min-width: 768px) { .hero { padding: 64px 0 96px; } .hero h1 { font-size: 64px; } }
@media (min-width: 1200px) { .hero h1 { font-size: 88px; } .hero figure { max-width: 640px; } }

/* Full-bleed mood image with one line */
.mood { position: relative; padding: 0; height: 64vh; min-height: 384px; max-height: 768px; overflow: hidden; }
.mood img { width: 100%; height: 100%; object-fit: cover; }
.mood::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgb(0 0 0 / .55)); }
.mood p { position: absolute; z-index: 1; left: 0; right: 0; bottom: 48px; text-align: center; color: #f5f5f7; font-size: 32px; font-weight: 600; letter-spacing: -.015em; padding: 0 16px; }
.mood p::first-letter { text-transform: uppercase; }
@media (min-width: 768px) { .mood p { font-size: 48px; bottom: 64px; } }

/* Feature rows: image | text, alternating */
.row { display: grid; gap: 32px; align-items: center; }
.row figure { border-radius: var(--r); overflow: hidden; background: var(--bg-alt); aspect-ratio: 4 / 5; }
.row figure img { width: 100%; height: 100%; object-fit: cover; }
.row .txt { max-width: 520px; }
.row h2 { margin-bottom: 16px; }
.price { display: block; margin-top: 16px; font-size: 17px; font-weight: 500; }
.price small, .p small, .ltr small { font-size: 12px; color: var(--muted); font-weight: 400; margin-inline-start: 4px; }
.row .more, .row .btn { margin-top: 24px; display: inline-block; }
.row .acts { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; margin-top: 24px; }
.row .acts > * { margin-top: 0; }
@media (min-width: 768px) {
  .row { grid-template-columns: 1fr 1fr; gap: 64px; }
  .row.flip figure { order: 2; }
}
.wide figure { aspect-ratio: 16 / 7; }
@media (min-width: 768px) { .wide.row { grid-template-columns: 1fr; } .wide .txt { max-width: 680px; margin: 0 auto; text-align: center; } .wide .acts { justify-content: center; } }
.badge { display: inline-block; font-size: 12px; font-weight: 500; letter-spacing: .02em; padding: 4px 8px; border-radius: 980px; background: var(--accent-soft); color: var(--accent); vertical-align: middle; margin-inline-start: 8px; }
/* Shisha smoke (Thamir chose "Soft puffs"): puffs rise from the bowl, inside the photo */
.smoke-wrap { position: relative; display: block; height: 100%; }
.smoke { position: absolute; width: 0; height: 0; pointer-events: none; }
.smoke i { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle, #fffd 0%, #fff8 40%, #fff0 72%); filter: blur(2px); opacity: 0; animation: puff 4.2s linear infinite; }
.smoke i:nth-child(2) { animation-delay: -1.05s; --dx: -12px; } .smoke i:nth-child(3) { animation-delay: -2.1s; --dx: 8px; } .smoke i:nth-child(4) { animation-delay: -3.15s; --dx: -4px; }
@keyframes puff { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 12% { opacity: .9; } 50% { transform: translate(calc(var(--dx, 6px) * .6), -48px) scale(1.6); opacity: .6; } 100% { transform: translate(var(--dx, 6px), -96px) scale(2.8); opacity: 0; } }
/* Flavour tiles (Asary) */
.flv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; margin-top: 24px; }
@media (min-width: 768px) { .flv { grid-template-columns: repeat(9, 1fr); } }
.flv div { text-align: center; font-size: 12px; line-height: 1.3; color: var(--muted); }
.flv img { width: 64px; height: 64px; object-fit: cover; border-radius: 50%; margin: 0 auto 8px; }

/* Rewards: one focal number */
.big { font-size: 96px; font-weight: 600; letter-spacing: -.03em; line-height: 1; color: var(--accent); direction: ltr; margin: 48px 0 32px; font-variant-numeric: lining-nums; }
@media (min-width: 768px) { .big { font-size: 160px; } }
.cards { display: grid; gap: 16px; text-align: start; max-width: 960px; margin: 0 auto; }
@media (min-width: 768px) { .cards { grid-template-columns: 1fr 1fr; gap: 24px; } }
.card { background: var(--bg); border-radius: var(--r); padding: 32px; }
.alt .card { background: var(--bg); } section:not(.alt) .card { background: var(--bg-alt); }
.card h3 { font-size: 22px; letter-spacing: -.01em; font-weight: 500; }
.card p { color: var(--muted); margin-top: 8px; }
.stamps { display: flex; gap: 8px; margin-top: 16px; direction: ltr; }
.stamps i { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--hair); }
.stamps i.free { border-color: var(--accent); background: var(--accent-soft); }
.rewnote { max-width: 680px; margin: 32px auto 0; color: var(--muted); }
.tiers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 960px; margin: 48px auto 0; }
@media (min-width: 768px) { .tiers { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
.tiers div { background: var(--bg); border-radius: 16px; padding: 24px 16px; text-align: center; }
.tiers b { display: block; font-weight: 600; font-size: 17px; }
.tiers span { display: block; font-size: 14px; color: var(--muted); margin-top: 4px; }
.levels-h { margin-top: 64px; }

/* Offers & events: tiles */
.tiles { display: grid; gap: 16px; }
@media (min-width: 768px) { .tiles { grid-template-columns: repeat(2, 1fr); gap: 24px; } }
@media (min-width: 1200px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tile { background: var(--bg-alt); border-radius: var(--r); padding: 32px 24px; display: flex; flex-direction: column; }
.tile .ti { height: 128px; width: 100%; object-fit: contain; margin-bottom: 24px; }
.tile small { color: var(--accent); font-size: 14px; font-weight: 500; }
.tile h3 { font-size: 22px; font-weight: 500; letter-spacing: -.01em; margin-top: 4px; }
.tile p { color: var(--muted); margin-top: 8px; flex: 1; }
.tile .tp { margin-top: 16px; font-weight: 500; display: flex; gap: 8px; align-items: baseline; } .tile .tp s { color: var(--muted); font-weight: 400; }
.tile .more { margin-top: 16px; }
.empty { color: var(--muted); text-align: center; }

/* Menu: segmented categories (phone), all cards (computer) */
.bar { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 48px -16px 0; padding: 0 16px 8px; }
.bar::-webkit-scrollbar { display: none; }
.bar a { flex: none; width: 160px; scroll-snap-align: start; text-decoration: none; color: var(--text); font-size: 14px; text-align: center; }
.bar img { width: 160px; height: 200px; object-fit: cover; border-radius: 16px; margin-bottom: 8px; background: var(--bg-alt); }
.barh { font-size: 22px; font-weight: 500; letter-spacing: -.01em; margin-top: 64px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 32px -16px 16px; padding: 4px 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; font: inherit; font-size: 14px; color: var(--text); background: var(--bg-alt); border: 0; padding: 8px 16px; border-radius: 980px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--text); color: var(--bg); }
.tabs .badge { margin-inline-start: 4px; padding: 0 8px; }
.scroller { display: flex; align-items: flex-start; gap: 16px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 8px; transition: height .3s var(--ease); }
.scroller::-webkit-scrollbar { display: none; }
.mc { flex: 0 0 88%; scroll-snap-align: center; background: var(--bg-alt); border-radius: var(--r); padding: 24px; scroll-margin-top: 64px; }
.mc h3 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 8px; }
.mc .bn { width: calc(100% + 48px); max-width: none; margin: -24px -24px 16px; aspect-ratio: 20 / 7; object-fit: cover; border-radius: var(--r) var(--r) 0 0; }
.mc .desc { color: var(--muted); font-size: 14px; }
.mc .flv { grid-template-columns: repeat(3, 1fr); margin: 16px 0; }
.mc .flv img { width: 48px; height: 48px; }
.mc .shot { border-radius: 16px; overflow: hidden; margin: 8px 0 16px; aspect-ratio: 4 / 3; }
.mc .shot img { width: 100%; height: 100%; object-fit: cover; }
.li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 8px; margin: 0 -8px; border-top: 1px solid var(--hair); border-radius: 8px; transition: background .3s var(--ease); }
.li:first-of-type { border-top: 0; }
.li .p { white-space: nowrap; direction: ltr; font-weight: 500; }
.li .sub { display: block; font-size: 14px; color: var(--muted); margin-top: 4px; }
.li .badge { margin-inline-start: 8px; }
/* item highlight (Thamir chose a highlight on hover/touch): soft accent wash, price in accent */
.li:active { background: var(--accent-soft); } .li:active .p { color: var(--accent); }
@media (hover: hover) { .li:hover { background: var(--accent-soft); } .li:hover .p { color: var(--accent); } }
.note { text-align: center; color: var(--muted); font-size: 14px; margin-top: 16px; }
@media (min-width: 1024px) {
  .tabs { display: none; } .swipe { display: none; }
  .scroller { display: block; columns: 3; column-gap: 24px; overflow: visible; margin: 48px 0 0; padding: 0; height: auto !important; }
  .mc { break-inside: avoid; margin-bottom: 24px; }
}
.fullmenu { text-align: center; margin-top: 32px; }

/* Collection strip: the cafe's own photos, black and white until hovered (computer) or tapped (phone) */
.strip { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 48px -16px 0; padding: 0 16px 8px; }
.strip::-webkit-scrollbar { display: none; }
.strip button { flex: none; width: 240px; aspect-ratio: 3 / 4; border: 0; padding: 0; border-radius: var(--r); overflow: hidden; scroll-snap-align: start; cursor: pointer; position: relative; background: var(--bg-alt); }
.strip img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: filter .5s var(--ease), transform .6s var(--ease); }
.strip button.on img { filter: none; }
@media (hover: hover) { .strip button:hover img { filter: none; transform: scale(1.03); } }
.strip .play { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgb(255 255 255 / .85); display: grid; place-items: center; }
.strip .play::before { content: ""; margin-left: 4px; border-style: solid; border-width: 8px 0 8px 12px; border-color: transparent transparent transparent #1d1d1f; }
@media (min-width: 768px) { .strip button { width: 280px; } }
.hint { text-align: center; color: var(--muted); font-size: 14px; margin-top: 16px; }

/* Visit */
.visit { display: grid; gap: 48px; }
@media (min-width: 768px) { .visit { grid-template-columns: 1fr 1fr; gap: 64px; align-items: start; } }
.info { list-style: none; padding: 0; }
.info li { display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--hair); }
.info li > span { color: var(--muted); }
.info b { font-weight: 400; text-align: end; }
.info a { color: var(--accent); text-decoration: none; text-align: end; }
.social { display: flex; gap: 24px; margin-top: 32px; }
.social a { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-size: 12px; }
.social svg { width: 28px; height: 28px; fill: none; stroke: var(--text); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.social a:hover svg { stroke: var(--accent); }

/* Lightbox */
.lb { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / .9); display: none; align-items: center; justify-content: center; padding: calc(64px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
.lb.on { display: flex; }
.lb img, .lb video { max-width: 100%; max-height: 100%; border-radius: 12px; }
.lb .lbs { max-height: 100%; overflow-y: auto; display: grid; gap: 12px; max-width: 560px; }
.lb .lbs img { max-height: none; width: 100%; }
.lb .x { position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .16); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }
.rtl .lb .x { right: auto; left: 16px; }

footer { background: var(--bg-alt); color: var(--muted); font-size: 12px; padding: 48px 0 calc(48px + env(safe-area-inset-bottom)); }
footer .wrap { display: grid; gap: 16px; }
footer .logo { width: 96px; height: 40px; }
footer nav { display: flex; flex-wrap: wrap; gap: 8px 24px; }
footer nav a { text-decoration: none; color: var(--text); }
footer .legal { border-top: 1px solid var(--hair); padding-top: 16px; }

/* Motion: fade + 24px rise on scroll; subtle parallax on the hero drink; all off with Reduce Motion */
.js .rv { opacity: 0; transform: translateY(24px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
.js .rv.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .js .rv { transform: none; transition: opacity .3s linear; }
  .smoke i { animation-duration: 12s; } .navp li { transform: none; }
  .swap b, .strip img, .li, .btn { transition: none; }
}
</style>
</head>
<body>

  addEventListener("resize", fitMenu);
  $("yr").textContent = new Date().getFullYear();

  let start = (location.hash || "").replace("#", "");
  if (!T[start]) { try { start = localStorage.getItem("amed-lang") || ""; } catch (_) { start = ""; } }
  if (!T[start]) { const nl = (navigator.language || "").toLowerCase(); start = nl.startsWith("ar") ? "ar" : nl.startsWith("en") ? "en" : "ku"; }
  setLang(start);
  observe(document.querySelectorAll(".rv"));
  addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (T[h]) setLang(h); });
  setInterval(renderStatus, 60000);

  fetch("menu.json", { cache: "no-cache" }).then((r) => r.ok ? r.json() : null).then((m) => { if (m) { MENU = m; renderFeatures(); renderNew(); renderMenu(); renderNav(); renderEvents(); observe(document.querySelectorAll(".rv:not(.in)")); } }).catch(() => {});
  fetch("data.json", { cache: "no-store" }).then((r) => r.ok ? r.json() : null).then((d) => { if (d) { DATA = d; renderRewards(); renderEvents(); renderInfo(); } }).catch(() => {});
})();
</script>
</body>
</html>
