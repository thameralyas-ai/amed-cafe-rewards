<style>
/* QR menu page (the table QR codes open this), in the same Apple-inspired design as the website:
   white space, system type, warm caramel accent; espresso in dark mode. Spacing: 4 8 12 16 24 32 48 64. */
/* Colours (Claude's choice for Thamir): the cafe at night. Espresso brown background, warm cream text,
   caramel-gold for prices and buttons (the brand's gold, warmed), olive green from the plant walls for small labels.
   One dark look in both light and dark mode. */
:root {
  --bg: #17110d; --bg-alt: #231b16; --text: #f2eadf; --muted: #b3a595; --hair: #3a2e26;
  --accent: #d4a46c; --accent-ink: #17110d; --accent-soft: #d4a46c1f; --leaf: #a6b47f;
  --nav: rgb(23 17 13 / .78);
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
  --serif: var(--sans); --ease: cubic-bezier(.25, .1, .25, 1);
  color-scheme: dark;
}
.rtl { --sans: -apple-system, BlinkMacSystemFont, "Noto Sans Arabic", "Inter", "Helvetica Neue", Arial, sans-serif; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2 { font-weight: 600; }
a { color: inherit; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
.latin { font-family: inherit; }

header { padding: calc(16px + env(safe-area-inset-top)) 0 0; text-align: center; }
.top { display: flex; align-items: center; justify-content: space-between; text-align: start; }
.logo { display: block; width: 72px; height: 32px; background: url(../logo-gold.png) center/contain no-repeat; }
.langs { display: flex; gap: 4px; }
.langs button { border: 0; background: none; padding: 4px; border-radius: 4px; opacity: .45; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 1px var(--accent); }
.flag { width: 20px; height: 14px; display: block; border-radius: 2px; }
h1 { font-size: 40px; line-height: 1.1; letter-spacing: -.02em; margin-top: 32px; }
.status { color: var(--muted); font-size: 14px; margin-top: 8px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34a853; margin-inline-end: 8px; vertical-align: 1px; }
.dot.off { background: #d9534f; }

/* Category bar: sticky and translucent, scrolls sideways, highlights the section you are reading */
nav { position: sticky; top: 0; z-index: 5; background: var(--nav); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid color-mix(in srgb, var(--hair) 60%, transparent); margin-top: 24px; }
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 8px 16px; max-width: 680px; margin: 0 auto; }
.cats::-webkit-scrollbar { display: none; }
.cats a { flex: none; padding: 8px 16px; border-radius: 980px; background: var(--bg-alt); color: var(--text); text-decoration: none; font-size: 14px; white-space: nowrap; }
.cats a.on { background: var(--text); color: var(--bg); }

section { scroll-margin-top: 64px; padding-top: 24px; }
.mc { background: var(--bg-alt); border-radius: 20px; padding: 24px; }
.mc h2 { font-size: 24px; letter-spacing: -.01em; line-height: 1.2; margin-bottom: 8px; }
.shot { margin: 8px 0 16px; }
/* Shisha smoke (Thamir chose "Soft puffs"): puffs rise from the bowl, inside the photo */
.smoke-wrap { position: relative; display: block; }
.smoke-wrap img { display: block; }
.smoke { position: absolute; left: 35%; top: 2px; width: 0; height: 0; pointer-events: none; }
.smoke i { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle, #fffd 0%, #fff8 40%, #fff0 72%); filter: blur(2px); opacity: 0; animation: puff 4.2s linear infinite; }
.smoke i:nth-child(2) { animation-delay: -1.05s; --dx: -12px; } .smoke i:nth-child(3) { animation-delay: -2.1s; --dx: 8px; } .smoke i:nth-child(4) { animation-delay: -3.15s; --dx: -4px; }
@keyframes puff { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 12% { opacity: .9; } 50% { transform: translate(calc(var(--dx, 6px) * .6), -40px) scale(1.6); opacity: .6; } 100% { transform: translate(var(--dx, 6px), -80px) scale(2.8); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .smoke i { animation-duration: 12s; } }
.shot img { width: 100%; height: auto; max-height: 280px; object-fit: contain; }
.shot.ph .smoke-wrap { overflow: hidden; border-radius: 16px; }
.shot.ph img { max-height: none; height: 320px; object-fit: cover; }
/* Offers (menu.json offers), first section: tiles in a swipe row (Thamir chose a swipe row) */
.ofs { display: flex; gap: 12px; margin: 16px -24px 0; padding: 0 24px 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.ofs::-webkit-scrollbar { display: none; }
.of { flex: none; width: 84%; scroll-snap-align: start; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto; column-gap: 12px; row-gap: 8px; padding: 16px; border-radius: 16px; background: var(--bg); }
.of > * { grid-column: 1; }
.of .oi { grid-column: 2; grid-row: 1 / span 3; align-self: center; width: 96px; height: 128px; object-fit: contain; }
.of .on { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.of small { display: block; color: var(--leaf); font-size: 12px; font-weight: 500; }
.of b { display: block; font-weight: 600; font-size: 17px; line-height: 1.3; }
.of p { color: var(--muted); font-size: 14px; line-height: 1.4; margin-top: 4px; }
.of .op { align-self: end; text-align: start; white-space: nowrap; font-weight: 500; direction: ltr; }
.of .op small { display: inline; color: var(--muted); font-weight: 400; margin-inline-start: 4px; }
.of .op s { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.of .ol { display: inline-block; margin-top: 8px; color: var(--accent); font-size: 14px; text-decoration: none; }
.of .ol:hover { text-decoration: underline; }
/* "From our bar": swipe row of real drink photos (menu.json gallery) */
.barw { margin: 32px 0 8px; }
.barh { font-weight: 600; font-size: 22px; letter-spacing: -.01em; margin: 0 0 16px; }
.bar { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; padding: 0 16px 8px; }
.bar::-webkit-scrollbar { display: none; }
.bar a { flex: none; width: 128px; scroll-snap-align: start; text-decoration: none; color: var(--text); font-size: 12px; line-height: 1.3; text-align: center; }
.bar img { display: block; width: 128px; height: 160px; object-fit: cover; border-radius: 16px; margin-bottom: 8px; background: var(--bg-alt); }
.li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 8px; margin: 0 -8px; border-top: 1px solid var(--hair); border-radius: 8px; font-size: 17px; transition: background .3s var(--ease); }
.mc h2 + .li, .mc .shot + .li, .mc .flv + .li, .mc .desc + .li { border-top: 0; }
.li .p { white-space: nowrap; direction: ltr; font-weight: 500; }
.li .p small { font-size: 12px; color: var(--muted); font-weight: 400; margin-inline-start: 4px; }
.li .sub { display: block; font-size: 14px; color: var(--muted); line-height: 1.4; margin-top: 4px; }
/* item highlight on hover / touch (Thamir chose a highlight): soft accent wash, price in accent */
.li:active { background: var(--accent-soft); } .li:active .p { color: var(--accent); }
@media (hover: hover) { .li:hover { background: var(--accent-soft); } .li:hover .p { color: var(--accent); } }
@media (prefers-reduced-motion: reduce) { .li { transition: none; } }
.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 980px; background: var(--accent-soft); color: var(--accent); vertical-align: middle; margin-inline-start: 8px; }
.cats a.on .badge { background: var(--bg); }
.mc .bn { display: block; width: calc(100% + 48px); margin: -24px -24px 16px; aspect-ratio: 20 / 7; object-fit: cover; border-radius: 20px 20px 0 0; }
.mc .desc { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
/* Flavour tiles (Asary) */
.flv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 8px; margin: 16px 0; }
.flv div { text-align: center; font-size: 12px; line-height: 1.3; color: var(--muted); }
.flv img { display: block; width: 48px; height: 48px; object-fit: cover; margin: 0 auto 8px; border-radius: 50%; }
/* "New" teaser at the top: links down to the new category */
.nw { display: flex; align-items: center; gap: 16px; margin-top: 24px; padding: 12px; border-radius: 16px; background: var(--bg-alt); text-decoration: none; }
.nw img { width: 96px; height: 56px; object-fit: cover; border-radius: 12px; flex: none; }
.nw b { display: block; font-weight: 600; font-size: 17px; }
.nw div > span { color: var(--muted); font-size: 14px; }
.nw::after { content: "›"; margin-inline-start: auto; color: var(--accent); font-size: 24px; padding: 0 8px; }
.rtl .nw::after { content: "‹"; }
.nw .badge { margin: 0 8px 0 0; } .rtl .nw .badge { margin: 0 0 0 8px; }
.note { text-align: center; color: var(--muted); font-size: 14px; margin-top: 16px; }

.promo { margin-top: 48px; text-align: center; border-radius: 20px; padding: 48px 24px; background: var(--bg-alt); }
.promo b { display: block; font-weight: 600; font-size: 28px; letter-spacing: -.015em; line-height: 1.2; }
.promo p { color: var(--muted); font-size: 17px; margin: 8px 0 24px; }
.btn { display: inline-block; padding: 12px 24px; border-radius: 980px; text-decoration: none; font-size: 17px; margin: 4px 8px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.sec { padding: 12px 0; color: var(--accent); }
.btn.sec::after { content: " ›"; } .rtl .btn.sec::after { content: " ‹"; }
footer { text-align: center; padding: 32px 0 calc(32px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 12px; }
footer a { color: var(--text); text-decoration: none; }
.err { text-align: center; color: var(--muted); padding: 48px 0; }
</style>
</head>

<main class="wrap">

</main>

<script>
(() => {
  const T = {
    en: { title: "Menu", open: "Open now · until 1:00 AM", closed: "Closed · opens at 8:00 AM", iqd: "IQD", note: "Prices in IQD",
      newT: "New", offT: "Offers", popular: "Best seller", barT: "From our bar", newSee: "Tap to see in the menu", promoT: "Buy 7, the 8th is free", promoP: "Drinks and shisha cards — give your phone number at the counter.", myCard: "My loyalty card", review: "Review us ★",
      hours: "Every day · 8:00 AM – 1:00 AM", err: "The menu could not load. Please check your connection and try again." },
    ar: { title: "القائمة", open: "مفتوح الآن · حتى 1:00 ليلاً", closed: "مغلق · نفتح الساعة 8:00 صباحاً", iqd: "د.ع", note: "الأسعار بالدينار العراقي",
      newT: "جديد", offT: "العروض", popular: "الأكثر طلباً", barT: "من مشروباتنا", newSee: "اضغط لعرضه في القائمة", promoT: "اشترِ 7 واحصل على الثامن مجاناً", promoP: "بطاقات للمشروبات والأركيلة — أعطِ رقم هاتفك عند الكاونتر.", myCard: "بطاقة الولاء الخاصة بي", review: "قيّمنا ★",
      hours: "كل يوم · 8:00 صباحاً – 1:00 ليلاً", err: "تعذّر تحميل القائمة. تحقّق من الاتصال وحاول مجدداً." },
    ku: { title: "مێنیو", open: "نوکە ڤەکریە · هەتا 1:00 شەڤێ", closed: "گرتیە · دەمژمێر 8:00 سپێدێ ڤەدبیت", iqd: "د.ع", note: "بها ب دینارێن عێراقی",
      newT: "نوو", offT: "پێشکێشی", popular: "پتر دهێتە داخوازکرن", barT: "ژ ڤەخوارنێن مە", newSee: "بکە بۆ دیتنێ د مێنیوێ دا", promoT: "7 بکڕە، یا 8ەمین بێ بەرامبەرە", promoP: "کارتێن ڤەخوارن و نێرگەلێ — ژمارا مۆبایلا خۆ ل کاونتەری بدە.", myCard: "کارتا من", review: "هەلسەنگاندن ★",
      hours: "هەمی رۆژ · 8:00 سپێدێ – 1:00 شەڤێ", err: "مێنیو بار نەبوو. هێڤیە پەیوەندیا خۆ پشکنە و دووبارە هەول بدە." },
  };
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v); } for (const k of kids) if (k != null) e.append(k); return e; };
  document.addEventListener("touchstart", () => {}, { passive: true }); // lets iPhone show the menu-item tap effect (:active)
  // Shisha photo gets rising smoke (see .smoke in the CSS).
  const shot = (c, src) => { const img = el("img", { src, alt: "", loading: "lazy" }), ph = /\.jpe?g$/i.test(src);
    const sm = el("span", ph && c.smoke ? { class: "smoke", "aria-hidden": "true", style: `left:${c.smoke[0]}%;top:${c.smoke[1]}%` } : { class: "smoke", "aria-hidden": "true" }, el("i"), el("i"), el("i"), el("i"));
    return el("div", { class: "shot" + (ph ? " ph" : "") }, c.id === "shisha" ? el("span", { class: "smoke-wrap" }, img, sm) : img); };
  // "From our bar" gallery: tapping a photo opens its menu section.
  const gallery = (pre, open, tag) => MENU && MENU.gallery && MENU.gallery.length ? el("div", { class: "barw" }, el(tag, { class: "barh", text: tr("barT") }),
    el("div", { class: "bar" }, ...MENU.gallery.map((g) => el("a", { href: "#", onclick: (e) => { e.preventDefault(); open(g.cat); } },
      el("img", { src: pre + g.img, alt: pick(g.name), loading: "lazy" }), el("span", { text: pick(g.name) }))))) : null;
  const popular = (it) => it.popular ? el("span", { class: "badge pop", text: tr("popular") }) : null;
  const num = (n) => Number(n).toLocaleString("en-US");
  let lang = "ku", MENU = null;
  const tr = (k) => T[lang][k];
  const pick = (o) => (o && (o[lang] || o.en)) || "";

  function isOpen() {
    const h = Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Baghdad", hour: "2-digit", hourCycle: "h23" }).format(new Date()));
    return h >= 8 || h < 1;
  }

  const flavours = (c, pre = "") => c.flavours ? el("div", { class: "flv" }, ...c.flavours.map((f) => el("div", {}, el("img", { src: pre + f.img, alt: "", loading: "lazy" }), pick(f.name)))) : null;
  function render() {
    const cats = $("cats"), list = $("list");
    cats.textContent = ""; list.textContent = ""; $("newTop").textContent = ""; $("bargal").textContent = "";
    if (!MENU) return;
    for (const c of MENU.categories.filter((c) => c.new)) {
      $("newTop").append(el("a", { class: "nw", href: "#c-" + c.id, onclick: (e) => { e.preventDefault(); go("c-" + c.id); } },
        c.banner ? el("img", { src: "../" + c.banner, alt: "" }) : null,
        el("div", {}, el("b", {}, el("span", { class: "badge", text: tr("newT") }), " ", pick(c.name)), el("span", { text: tr("newSee") }))));
    }
    const g = gallery("../", (cat) => go("c-" + cat), "h2"); if (g) $("bargal").append(g);
    if (MENU.offers && MENU.offers.length) {   // Offers first
      cats.append(el("a", { href: "#c-offers", "data-id": "c-offers" }, tr("offT")));
      list.append(el("section", { id: "c-offers" }, el("div", { class: "mc ofc" }, el("h2", { text: tr("offT") }),
        el("div", { class: "ofs s1" }, ...MENU.offers.map((o, i) => el("div", { class: "of" }, o.img ? el("img", { class: "oi", src: "../" + o.img, alt: "", loading: "lazy" }) : null, el("span", { class: "on", text: String(i + 1) }),
          el("div", { class: "ob" }, o.when ? el("small", { text: pick(o.when) }) : null, el("b", { text: pick(o.title) }), el("p", { text: pick(o.text) }),
            o.link === "card" ? el("a", { class: "ol", href: "../card/", text: tr("myCard") + " ›" }) : null),
          o.price ? el("span", { class: "op" }, num(o.price), el("small", { text: tr("iqd") }), o.was ? el("s", { text: num(o.was) }) : null) : null))))));
    }
    for (const c of MENU.categories) {
      const id = "c-" + c.id;
      const badge = () => c.new ? el("span", { class: "badge", text: tr("newT") }) : null;
      cats.append(el("a", { href: "#" + id, "data-id": id }, pick(c.name), badge()));
      const card = el("div", { class: "mc" });
      if (c.banner) card.append(el("img", { class: "bn", src: "../" + c.banner, alt: "", loading: "lazy" }));
      card.append(el("h2", {}, pick(c.name), badge()));
      if (c.desc) card.append(el("p", { class: "desc", text: pick(c.desc) }));
      if (c.flavours) card.append(flavours(c, "../"));
      if (c.photo) card.append(shot(c, "../" + c.photo));
      for (const it of c.items) {
        const opts = it.options || [];
        const same = opts.every((o) => o.price === opts[0].price);
        const sub = [opts.length ? opts.map((o) => pick(o.name) + (same ? "" : " " + num(o.price))).join(" · ") : "", pick(it.note)].filter(Boolean).join(" — ");
        card.append(el("div", { class: "li" }, el("span", {}, pick(it.name), popular(it), sub ? el("small", { class: "sub", text: sub }) : null),
          el("span", { class: "p" }, num(it.price), el("small", { text: tr("iqd") }))));
      }
      list.append(el("section", { id }, card));
    }
    spy();
  }

  // Highlight the category being read and keep its button in view.
  let cur = "";
  function spy() {
    const secs = document.querySelectorAll("#list section");
    let id = secs[0] && secs[0].id;
    for (const s of secs) if (s.getBoundingClientRect().top < 90) id = s.id;
    if (id === cur) return; cur = id;
    for (const a of $("cats").children) {
      const on = a.dataset.id === id; a.classList.toggle("on", on);
      if (on) { const r = $("cats").getBoundingClientRect(), b = a.getBoundingClientRect(); $("cats").scrollBy({ left: (b.left + b.width / 2) - (r.left + r.width / 2), behavior: "smooth" }); }
    }
  }
  addEventListener("scroll", spy, { passive: true });
  $("cats").addEventListener("click", (e) => {
    const a = e.target.closest("a"); if (!a) return;
    e.preventDefault();
    go(a.dataset.id);
  });
  function go(id) { const s = $(id); scrollTo({ top: s.getBoundingClientRect().top + scrollY - 56, behavior: "smooth" }); }

  function setLang(l) {
    lang = T[l] ? l : "ku";
    document.documentElement.lang = lang === "ku" ? "ckb" : lang;
    document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
    document.body.classList.toggle("rtl", lang !== "en");
    for (const b of document.querySelectorAll(".langs button")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    for (const n of document.querySelectorAll("[data-t]")) n.textContent = tr(n.dataset.t);
    $("promoT").textContent = tr("promoT");
    const o = isOpen(); $("dot").classList.toggle("off", !o); $("openTxt").textContent = o ? tr("open") : tr("closed");
    $("cardBtn").href = "../card/#" + lang;
    try { localStorage.setItem("amed-lang", lang); } catch (_) {}
    cur = ""; render();
    if (!MENU && $("list").dataset.err) $("list").append(el("p", { class: "err", text: tr("err") }));
  }
  for (const b of document.querySelectorAll(".langs button")) b.addEventListener("click", () => { setLang(b.dataset.lang); history.replaceState(null, "", "#" + lang); });

  let start = (location.hash || "").replace("#", "");
  if (!T[start]) { try { start = localStorage.getItem("amed-lang") || ""; } catch (_) { start = ""; } }
  if (!T[start]) { const nl = (navigator.language || "").toLowerCase(); start = nl.startsWith("ar") ? "ar" : nl.startsWith("en") ? "en" : "ku"; }
  setLang(start);
  fetch("../menu.json", { cache: "no-cache" }).then((r) => r.json()).then((m) => { MENU = m; render(); })
    .catch(() => { $("list").dataset.err = "1"; $("list").append(el("p", { class: "err", text: tr("err") })); });
})();
</script>
</body>
</html>
