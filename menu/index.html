<style>
/* QR menu page: the table QR codes open this. Same Espresso & Gold look as the website. */
:root {
  --bg: #1C120D; --surface: #2A1C15; --ink: #F3E9DC; --muted: #C4B09C; --gold: #D4A373; --gold2: #E3B27D; --line: #3F2D23;
  --serif: "Cormorant Garamond", Georgia, serif; --sans: Jost, system-ui, sans-serif;
  color-scheme: dark;
}
.rtl { --serif: "Noto Naskh Arabic", "Cormorant Garamond", serif; --sans: "Noto Sans Arabic", Jost, system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 300 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2 { font-family: var(--serif); font-weight: 500; }
a { color: inherit; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

header { padding: calc(14px + env(safe-area-inset-top)) 0 6px; }
.top { display: flex; align-items: center; justify-content: space-between; }
.logo { display: block; width: 92px; height: 42px; background: url(../logo-gold.png) center/contain no-repeat; }
.langs { display: flex; gap: 6px; }
.langs button { border: 0; background: none; padding: 4px; border-radius: 6px; opacity: .5; cursor: pointer; }
.langs button[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 1.5px var(--gold); }
.flag { width: 28px; height: 19px; display: block; border-radius: 3px; }
h1 { text-align: center; font-size: 40px; line-height: 1.1; margin-top: 14px; }
.rtl h1 { font-size: 32px; }
.status { text-align: center; color: var(--muted); font-size: 14px; margin-top: 4px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #7BC67E; margin-inline-end: 6px; vertical-align: 1px; box-shadow: 0 0 8px #7BC67E; }
.dot.off { background: #C97B63; box-shadow: none; }

/* Category bar: sticks to the top, scrolls sideways, highlights the section you are reading. */
nav { position: sticky; top: 0; z-index: 5; background: #1C120DF2; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-top: 14px; }
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px 16px; max-width: 680px; margin: 0 auto; }
.cats::-webkit-scrollbar { display: none; }
.cats a { flex: none; padding: 7px 14px; border-radius: 99px; border: 1px solid #D4A37355; color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
.cats a.on { background: var(--gold); border-color: var(--gold); color: #1C120D; font-weight: 500; }

section { scroll-margin-top: 64px; padding-top: 22px; }
.mc { background: linear-gradient(180deg, #2E1F17, #241812); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px 8px; }
.mc h2 { font-size: 28px; color: var(--gold2); line-height: 1.2; }
.rtl .mc h2 { font-size: 23px; }
.shot { display: grid; place-items: center; margin: 4px 0; }
.shot img { height: 120px; filter: drop-shadow(0 10px 12px #000a); }
/* Shisha smoke (Thamir chose "Soft puffs"): puffs rise from the bowl at the top of the shisha photo. */
.smoke-wrap { position: relative; display: inline-block; }
.smoke-wrap { margin-top: 64px; }
.smoke-wrap img { display: block; }
.smoke { position: absolute; left: 35%; top: 2px; width: 0; height: 0; pointer-events: none; }
.smoke i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, #fffd 0%, #fff8 40%, #fff0 72%); filter: blur(2px); opacity: 0; animation: puff 4.2s linear infinite; }
.smoke i:nth-child(2) { animation-delay: -1.05s; --dx: -10px; } .smoke i:nth-child(3) { animation-delay: -2.1s; --dx: 8px; } .smoke i:nth-child(4) { animation-delay: -3.15s; --dx: -4px; }
@keyframes puff { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 12% { opacity: .9; } 50% { transform: translate(calc(var(--dx, 6px) * .6), -38px) scale(1.6); opacity: .6; } 100% { transform: translate(var(--dx, 6px), -80px) scale(2.8); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .smoke i { animation-duration: 12s; } }
/* Offers (menu.json offers), first section of the menu: gold cards in a swipe row (Thamir chose sample 2). */
.ofs { display: flex; gap: 10px; margin: 8px -18px 10px; padding: 0 18px 6px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.ofs::-webkit-scrollbar { display: none; }
.of { flex: none; width: 78%; min-height: 170px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid #D4A37366; border-radius: 16px; background: linear-gradient(135deg, #3A281E, #241812); }
.of .on { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: #1C120D; display: grid; place-items: center; font-weight: 500; font-size: 15px; }
.of .ob { flex: 1; min-width: 0; }
.of small { display: block; color: var(--gold); font-size: 12.5px; }
.of b { display: block; font-weight: 500; font-size: 17px; line-height: 1.35; }
.of p { color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 2px; }
.of .op { margin-top: auto; text-align: start; white-space: nowrap; color: var(--gold2); font-size: 17px; direction: ltr; }
.of .op small { display: inline; color: var(--muted); font-size: 11px; margin-inline-start: 3px; }
.of .op s { display: block; color: var(--muted); font-size: 12.5px; }
.of .ol { display: inline-block; margin-top: 6px; color: var(--gold2); font-size: 13.5px; text-decoration: none; border-bottom: 1px solid #D4A37366; }
/* "From our bar": swipe row of real drink photos (menu.json gallery), not tied to single items. */
.barw { margin: 6px 0 16px; }
.barh { font-family: var(--serif); font-weight: 500; font-size: 24px; color: var(--gold2); line-height: 1.2; margin: 0 0 10px; }
.bar { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; padding: 0 16px 6px; }
.bar::-webkit-scrollbar { display: none; }
.bar a { flex: none; width: 128px; scroll-snap-align: start; text-decoration: none; color: var(--ink); font-size: 13px; line-height: 1.3; text-align: center; }
.bar img { display: block; width: 128px; height: 164px; object-fit: cover; border-radius: 16px; margin-bottom: 6px; border: 1px solid var(--line); background: #2A1C15; }
/* "Best seller" badge on an item (it.popular) */
.badge.pop { background: none; color: var(--gold2); box-shadow: inset 0 0 0 1px var(--gold); }
/* Shisha as a real photo: smoke starts at c.smoke (% of the photo) and stays inside the rounded photo */
.shot.ph .smoke-wrap { margin-top: 0; overflow: hidden; border-radius: 18px; box-shadow: 0 10px 24px #0008; }
.shot.ph img { height: 250px; width: auto; filter: none; }
.li { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid #3F2D2399; font-size: 16px; }
.li:last-child { border: 0; }
.li .p { color: var(--gold2); font-weight: 400; white-space: nowrap; direction: ltr; }
.li .p small { font-size: 11px; color: var(--muted); margin-inline-start: 3px; }
.li .sub { display: block; font-size: 13px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
/* Menu item hover (Thamir chose samples 1 + 3): soft gold glow with a gold bar at the start, name bold and gold, price a bit bigger.
   Mouse: on hover. Phones: shows while the item is touched. */
.li { position: relative; border-radius: 10px; margin-inline: -10px; padding-inline: 10px; transition: background .25s ease, box-shadow .25s ease; }
.li::before { content: ""; position: absolute; inset-inline-start: 0; top: 22%; bottom: 22%; width: 3px; border-radius: 3px; background: var(--gold); transform: scaleY(0); transition: transform .25s ease; }
.li > span:first-child { transition: color .25s ease; }
.li .p { display: inline-block; transition: transform .25s ease; }
.li:active { background: #D4A3731F; box-shadow: 0 0 0 1px #D4A37344; }
.li:active::before { transform: scaleY(1); }
.li:active > span:first-child { font-weight: 500; color: var(--gold2); }
.li:active .p { transform: scale(1.12); }
@media (hover: hover) {
  .li:hover { background: #D4A3731F; box-shadow: 0 0 0 1px #D4A37344; }
  .li:hover::before { transform: scaleY(1); }
  .li:hover > span:first-child { font-weight: 500; color: var(--gold2); }
  .li:hover .p { transform: scale(1.12); }
}
@media (prefers-reduced-motion: reduce) { .li, .li::before, .li .p, .li > span:first-child { transition: none; } }
.badge { display: inline-block; font-family: var(--sans); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; color: #1C120D; background: var(--gold); padding: 1px 8px; border-radius: 99px; vertical-align: middle; margin-inline-start: 6px; }
.rtl .badge { letter-spacing: 0; font-size: 12px; }
.cats a.on .badge { background: #1C120D; color: var(--gold2); }
.mc .bn { display: block; width: calc(100% + 36px); margin: -16px -18px 12px; aspect-ratio: 20 / 7; object-fit: cover; border-radius: 20px 20px 0 0; }
.mc .desc { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 2px 0 4px; }
/* Flavour tiles (e.g. Asary): fruit picture + name, 3 per row. */
.flv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 8px; }
.flv div { text-align: center; font-size: 12.5px; line-height: 1.3; color: var(--ink); }
.flv img { display: block; width: 100%; max-width: 76px; aspect-ratio: 1; object-fit: cover; margin: 0 auto 5px; border-radius: 14px; background: #F3E9DC; }
/* "New" teaser at the top: links down to the new category. */
.nw { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 10px; border: 1px solid #D4A37388; border-radius: 18px; background: radial-gradient(circle at 0 50%, #3A281E, #241812); text-decoration: none; }
.nw img { width: 96px; height: 56px; object-fit: cover; border-radius: 12px; flex: none; }
.nw b { display: block; font-weight: 500; color: var(--gold2); font-size: 15px; }
.nw div > span { color: var(--muted); font-size: 13px; }
.nw::after { content: "›"; margin-inline-start: auto; color: var(--gold2); font-size: 26px; padding: 0 6px; }
.rtl .nw::after { content: "‹"; }
.note { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; }

.promo { margin-top: 26px; text-align: center; border: 1px solid #D4A37366; border-radius: 20px; padding: 20px 18px; background: radial-gradient(circle at 50% 0, #3A281E, #241812); }
.promo b { display: block; font-family: var(--serif); font-weight: 500; font-size: 26px; color: var(--gold2); line-height: 1.25; }
.rtl .promo b { font-size: 21px; }
.promo p { color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
.btn { display: inline-block; padding: 11px 20px; border-radius: 99px; text-decoration: none; font-size: 14px; margin: 4px; }
.btn.pri { background: var(--gold); color: #1C120D; font-weight: 500; }
.btn.sec { border: 1px solid #D4A37399; color: var(--gold2); }
footer { text-align: center; padding: 28px 0 calc(30px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 13px; }
footer a { color: var(--gold2); text-decoration: none; }
.err { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>

<script>
(() => {
  const T = {
    en: { title: "Menu", open: "Open now · until 1:00 AM", closed: "Closed · opens at 8:00 AM", iqd: "IQD", note: "Prices in IQD",
      newT: "New", offT: "Offers", popular: "Best seller", barT: "From our bar", newSee: "Tap to see in the menu", promoT: "Buy 7, the 8th is free", promoP: "Drinks and shisha cards — give your phone number at the counter.", myCard: "My loyalty card", review: "Review us ★",

    ar: { title: "القائمة", open: "مفتوح الآن · حتى 1:00 ليلاً", closed: "مغلق · نفتح الساعة 8:00 صباحاً", iqd: "د.ع", note: "الأسعار بالدينار العراقي",
      newT: "جديد", offT: "العروض", popular: "الأكثر طلباً", barT: "من مشروباتنا", newSee: "اضغط لعرضه في القائمة", promoT: "اشترِ 7 واحصل على الثامن مجاناً", promoP: "بطاقات للمشروبات والأركيلة — أعطِ رقم هاتفك عند الكاونتر.", myCard: "بطاقة الولاء الخاصة بي", review: "قيّمنا ★",
      hours: "كل يوم · 8:00 صباحاً – 1:00 ليلاً", err: "تعذّر تحميل القائمة. تحقّق من الاتصال وحاول مجدداً." },
    ku: { title: "مێنیو", open: "نوکە ڤەکریە · هەتا 1:00 شەڤێ", closed: "گرتیە · دەمژمێر 8:00 سپێدێ ڤەدبیت", iqd: "د.ع", note: "بها ب دینارێن عێراقی",
      newT: "نوو", offT: "پێشکێشی", popular: "پتر دهێتە داخوازکرن", barT: "ژ ڤەخوارنێن مە", newSee: "بکە بۆ دیتنێ د مێنیوێ دا", promoT: "7 بکڕە، یا 8ەمین بێ بەرامبەرە", promoP: "کارتێن ڤەخوارن و نێرگەلێ — ژمارا مۆبایلا خۆ ل کاونتەری بدە.", myCard: "کارتا من", review: "هەلسەنگاندن ★",
      hours: "هەمی رۆژ · 8:00 سپێدێ – 1:00 شەڤێ", err: "مێنیو بار نەبوو. هێڤیە پەیوەندیا خۆ پشکنە و دووبارە هەول بدە." },
  };
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v); } for (const k of kids) if (k != null) e.append(k); return e; };
  document.addEventListener("touchstart", () => {}, { passive: true }); // lets iPhone show the menu-item tap effect (:active)
  // Shisha photo gets rising smoke (see .smoke in the CSS).
  const shot = (c, src) => { const img = el("img", { src, alt: "", loading: "lazy" }), ph = /\.jpe?g$/i.test(src);

  const gallery = (pre, open, tag) => MENU && MENU.gallery && MENU.gallery.length ? el("div", { class: "barw" }, el(tag, { class: "barh", text: tr("barT") }),
    el("div", { class: "bar" }, ...MENU.gallery.map((g) => el("a", { href: "#", onclick: (e) => { e.preventDefault(); open(g.cat); } },

  const popular = (it) => it.popular ? el("span", { class: "badge pop", text: tr("popular") }) : null;
  const num = (n) => Number(n).toLocaleString("en-US");
  let lang = "ku", MENU = null;
  const tr = (k) => T[lang][k];
  const pick = (o) => (o && (o[lang] || o.en)) || "";

  function isOpen() {

  const flavours = (c, pre = "") => c.flavours ? el("div", { class: "flv" }, ...c.flavours.map((f) => el("div", {}, el("img", { src: pre + f.img, alt: "", loading: "lazy" }), pick(f.name)))) : null;
  function render() {

    for (const c of MENU.categories.filter((c) => c.new)) {
      $("newTop").append(el("a", { class: "nw", href: "#c-" + c.id, onclick: (e) => { e.preventDefault(); go("c-" + c.id); } },
        c.banner ? el("img", { src: "../" + c.banner, alt: "" }) : null,
        el("div", {}, el("b", {}, el("span", { class: "badge", text: tr("newT") }), " ", pick(c.name)), el("span", { text: tr("newSee") }))));
    }
    const g = gallery("../", (cat) => go("c-" + cat), "h2"); if (g) $("bargal").append(g);

          el("div", { class: "ob" }, o.when ? el("small", { text: pick(o.when) }) : null, el("b", { text: pick(o.title) }), el("p", { text: pick(o.text) }),
            o.link === "card" ? el("a", { class: "ol", href: "../card/", text: tr("myCard") + " ›" }) : null),
          o.price ? el("span", { class: "op" }, num(o.price), el("small", { text: tr("iqd") }), o.was ? el("s", { text: num(o.was) }) : null) : null))))));
    }
    for (const c of MENU.categories) {
      const id = "c-" + c.id;
      const badge = () => c.new ? el("span", { class: "badge", text: tr("newT") }) : null;
      cats.append(el("a", { href: "#" + id, "data-id": id }, pick(c.name), badge()));
      const card = el("div", { class: "mc" });
      if (c.banner) card.append(el("img", { class: "bn", src: "../" + c.banner, alt: "", loading: "lazy" }));
      card.append(el("h2", {}, pick(c.name), badge()));
      if (c.desc) card.append(el("p", { class: "desc", text: pick(c.desc) }));
      if (c.flavours) card.append(flavours(c, "../"));
      if (c.photo) card.append(shot(c, "../" + c.photo));
      for (const it of c.items) {
        const opts = it.options || [];
        const same = opts.every((o) => o.price === opts[0].price);
        const sub = [opts.length ? opts.map((o) => pick(o.name) + (same ? "" : " " + num(o.price))).join(" · ") : "", pick(it.note)].filter(Boolean).join(" — ");
        card.append(el("div", { class: "li" }, el("span", {}, pick(it.name), popular(it), sub ? el("small", { class: "sub", text: sub }) : null),
          el("span", { class: "p" }, num(it.price), el("small", { text: tr("iqd") }))));
      }
      list.append(el("section", { id }, card));
    }
    spy();
  }

  // Highlight the category being read and keep its button in view.
  let cur = "";
  function spy() {
    const secs = document.querySelectorAll("#list section");
    let id = secs[0] && secs[0].id;
    for (const s of secs) if (s.getBoundingClientRect().top < 90) id = s.id;
    if (id === cur) return; cur = id;
    for (const a of $("cats").children) {
      const on = a.dataset.id === id; a.classList.toggle("on", on);
      if (on) { const r = $("cats").getBoundingClientRect(), b = a.getBoundingClientRect(); $("cats").scrollBy({ left: (b.left + b.width / 2) - (r.left + r.width / 2), behavior: "smooth" }); }
    }
  }
  addEventListener("scroll", spy, { passive: true });
  $("cats").addEventListener("click", (e) => {
    const a = e.target.closest("a"); if (!a) return;
    e.preventDefault();
    go(a.dataset.id);
  });
  function go(id) { const s = $(id); scrollTo({ top: s.getBoundingClientRect().top + scrollY - 56, behavior: "smooth" }); }

  function setLang(l) {
    lang = T[l] ? l : "ku";
    document.documentElement.lang = lang === "ku" ? "ckb" : lang;
    document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
    document.body.classList.toggle("rtl", lang !== "en");
    for (const b of document.querySelectorAll(".langs button")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    for (const n of document.querySelectorAll("[data-t]")) n.textContent = tr(n.dataset.t);
    $("promoT").textContent = tr("promoT");
    const o = isOpen(); $("dot").classList.toggle("off", !o); $("openTxt").textContent = o ? tr("open") : tr("closed");
    $("cardBtn").href = "../card/#" + lang;
    try { localStorage.setItem("amed-lang", lang); } catch (_) {}
    cur = ""; render();
    if (!MENU && $("list").dataset.err) $("list").append(el("p", { class: "err", text: tr("err") }));
  }
  for (const b of document.querySelectorAll(".langs button")) b.addEventListener("click", () => { setLang(b.dataset.lang); history.replaceState(null, "", "#" + lang); });

  let start = (location.hash || "").replace("#", "");
  if (!T[start]) { try { start = localStorage.getItem("amed-lang") || ""; } catch (_) { start = ""; } }
  if (!T[start]) { const nl = (navigator.language || "").toLowerCase(); start = nl.startsWith("ar") ? "ar" : nl.startsWith("en") ? "en" : "ku"; }
  setLang(start);
  fetch("../menu.json", { cache: "no-cache" }).then((r) => r.json()).then((m) => { MENU = m; render(); })
    .catch(() => { $("list").dataset.err = "1"; $("list").append(el("p", { class: "err", text: tr("err") })); });
})();
</script>
</body>
</html>
