<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14110E">
<title>Amed Cafe – Card scanner</title>
<style>
  :root { --bg: #14110E; --ink: #F3EADF; --muted: #B9AC9C; --accent: #C8925F; --line: #3A322B; --danger: #FF8A7A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
  header img { height: 34px; width: auto; filter: invert(1); }
  header h1 { margin: 0; font-size: 1rem; font-weight: 700; color: var(--muted); }
  .view { position: relative; overflow: hidden; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; left: 50%; top: 50%; width: min(70vw, 52vh, 420px); aspect-ratio: 1; transform: translate(-50%, -50%); border: 4px solid #fff; border-radius: 22px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); transition: border-color .15s; }
  .frame.ok { border-color: #5BD38A; }
  footer { display: grid; gap: 12px; padding: 14px 16px 18px; }
  #msg { margin: 0; text-align: center; font-size: 1.05rem; min-height: 1.5em; }
  #msg.err { color: var(--danger); font-weight: 600; }
  #msg.ok { color: #5BD38A; font-weight: 700; font-size: 1.2rem; }
  .btns { display: flex; gap: 10px; }
  button, .btn { flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: #221D18; color: var(--ink); font: 600 1rem inherit; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 0 14px; }
  .primary { background: var(--accent); border-color: var(--accent); color: #1B130C; }
  .res { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 2; display: grid; gap: 6px; padding: 18px 20px; border-radius: 20px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.5); animation: resIn .35s cubic-bezier(.2,1.4,.4,1); }
  .res.ok { background: #1F6B43; color: #fff; }
  .res.warn { background: #8A5A12; color: #fff; }
  .res b { font-size: 1.6rem; line-height: 1.2; }
  .res span { font-size: 1.15rem; }
  #resLine { font-size: 1.35rem; font-weight: 800; letter-spacing: .02em; }
  @keyframes resIn { from { transform: translateY(30px) scale(.9); opacity: 0; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><img src="/logo.png" alt="Amed Cafe"><h1 id="title">Card scanner</h1></header>
<div class="view"><video id="video" playsinline muted autoplay></video><div class="frame" id="frame" aria-hidden="true"></div>
  <div class="res" id="res" role="status" hidden><b id="resName"></b><span id="resNote"></span><span id="resLine"></span></div></div>
<footer>
  <p id="msg" role="status"></p>
  <div class="btns">
    <button type="button" id="switch">Switch camera</button>
    <button type="button" id="close">Close</button>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" async></script>
<script>
(() => {
  const STAFF_ORIGIN = "https://claude.ai", LIVE_HOST = "https://ntfy.sh";
  const T = {
    en: { title: "Card scanner", point: "Point the camera at the QR code on the customer's phone.", allow: "Allow the camera so the scanner can read the code.", denied: "The camera is blocked. In the browser, tap the lock icon next to the address (or open Settings → Site settings → Camera), allow the camera for amedcaferest.com, then reload.", notMember: "This QR code is not an Amed Cafe member card.", found: "Card found: {code}", stamped: "Done ✓ — ready for the next customer", noLink: "Not connected to the staff tool. Close this tab, go to the staff tool tab and tap Scan there.", noAnswer: "The staff tool didn't answer. Open the staff tool tab once, then come back here.", backHint: "Go back to the staff tool tab — the card is open there.", openCard: "Open card", sw: "Switch camera", close: "Close", noCam: "No camera found on this device." },
    ar: { title: "ماسح البطاقات", point: "وجّه الكاميرا نحو رمز QR على هاتف الزبون.", allow: "اسمح باستخدام الكاميرا ليقرأ الماسح الرمز.", denied: "الكاميرا محظورة. في المتصفح اضغط على رمز القفل بجانب العنوان (أو الإعدادات ← إعدادات المواقع ← الكاميرا)، واسمح بالكاميرا لموقع amedcaferest.com، ثم أعد التحميل.", notMember: "هذا الرمز ليس بطاقة عضوية لمقهى أميد.", found: "تم العثور على البطاقة: {code}", stamped: "تم ✓ — جاهز للزبون التالي", noLink: "غير متصل بأداة الموظفين. أغلق هذا التبويب، واذهب إلى تبويب أداة الموظفين واضغط «مسح» من هناك.", noAnswer: "لم تستجب أداة الموظفين. افتح تبويبها مرة واحدة ثم عد إلى هنا.", backHint: "ارجع إلى تبويب أداة الموظفين — البطاقة مفتوحة هناك.", openCard: "افتح البطاقة", sw: "تبديل الكاميرا", close: "إغلاق", noCam: "لا توجد كاميرا في هذا الجهاز." },
    ku: { title: "سکانەرێ کارتان", point: "کامێرایێ بەرەڤ کۆدێ QR ل سەر مۆبایلا کڕیاری بگرە.", allow: "ڕێ بدە کامێرایێ دا سکانەر کۆدی بخوینیت.", denied: "کامێرا هاتیە ڕاگرتن. د وێبگەڕی دا ل سەر نیشانا قفلێ ل تەنیشت ناڤنیشانی بدە (یان ڕێکخستن ← ڕێکخستنێن ماڵپەڕی ← کامێرا)، ڕێ بدە کامێرایێ بۆ amedcaferest.com، پاشان پەڕێ نوو بکە.", notMember: "ئەڤ کۆدە نە کارتا ئەندامێتیا ئامێد کافێیە.", found: "کارت هاتە دیتن: {code}", stamped: "تمام ✓ — بۆ کڕیارێ دی ئامادەیە", noLink: "ب ئامرازێ کارمەندان ڤە نەگرێدایە. ڤێ تابێ دابخە، بچە تابا ئامرازێ کارمەندان و ژ وێرێ «سکان» بکە.", noAnswer: "ئامرازێ کارمەندان بەرسڤ نەدا. جارەکێ تابا وێ ڤەکە، پاشان بزڤڕە ڤێرێ.", backHint: "بزڤڕە تابا ئامرازێ کارمەندان — کارت ل وێرێ ڤەبوویە.", openCard: "کارتێ ڤەکە", sw: "کامێرایێ بگوهۆڕە", close: "دابخە", noCam: "چ کامێرا ل سەر ڤێ ئامیرێ نینە." }
  };
  const qs = new URLSearchParams(location.search);
  const lang = T[qs.get("lang")] ? qs.get("lang") : "en";
  const tr = (k, v) => T[lang][k].replace(/\{(\w+)\}/g, (m, x) => (v && x in v ? v[x] : m));
  document.documentElement.lang = lang === "ku" ? "ckb" : lang;
  document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
  const $ = (id) => document.getElementById(id);
  $("title").textContent = tr("title"); $("switch").textContent = tr("sw"); $("close").textContent = tr("close");
  const msg = (text, cls) => { $("msg").textContent = text; $("msg").className = cls || ""; };

  let stream = null, timer = 0, done = false, detector, facing = "environment";
  try { facing = localStorage.getItem("amed-scan-facing") || "environment"; } catch (_) {}
  const progFrom = (s) => { const m = String(s).match(/#m-[A-Z0-9]{6}\.([a-z]{2,20})\b/i); return m ? m[1].toLowerCase() : null; };
  const codeFrom = (s) => { const m = String(s).match(/#m-([A-Z0-9]{6})\b/i) || String(s).trim().match(/^([A-Z0-9]{6})$/i); return m ? m[1].toUpperCase() : null; };

  async function getDetector() {
    if (detector !== undefined) return detector;
    detector = null;
    try { if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("qr_code")) detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (_) {}
    return detector;
  }
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
  async function decode(v) {
    const d = await getDetector();
    if (d) { try { const r = await d.detect(v); if (r.length) return r[0].rawValue; } catch (_) {} }
    if (!window.jsQR || !v.videoWidth) return null;
    const k = Math.min(1, 900 / Math.max(v.videoWidth, v.videoHeight));
    cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k);
    cx.drawImage(v, 0, 0, cv.width, cv.height);
    const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: "attemptBoth" });
    return r ? r.data : null;
  }
  function stop() { clearTimeout(timer); if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; }

  // Continuous counter scanner: after each card it shows the result for a few seconds, then scans the next one by itself.
  let lastRaw = "", lastRawAt = 0, resTimer = 0;
  function showResult(kind, name, note, line) {
    const r = $("res"); r.className = "res " + kind; $("resName").textContent = name || ""; $("resNote").textContent = note || ""; $("resLine").textContent = line || "";
    $("resName").hidden = !name; $("resLine").hidden = !line; r.hidden = false;
  }
  function nextCustomer(ms) {
    clearTimeout(resTimer);
    resTimer = setTimeout(() => { $("res").hidden = true; $("frame").classList.remove("ok"); done = false; msg(tr("point")); if (stream) loop(); else start(); }, ms);
  }
  async function found(code, raw) {
    const p = progFrom(raw);
    done = true; clearTimeout(timer); lastRaw = raw; lastRawAt = Date.now(); $("frame").classList.add("ok");
    try { navigator.vibrate && navigator.vibrate(90); } catch (_) {}
    msg(tr("found", { code }), "ok");
    const op = window.opener;
    if (!op || op.closed) { showResult("warn", "", tr("noLink"), ""); nextCustomer(5000); return; }
    const rid = Math.random().toString(36).slice(2) + Date.now().toString(36);
    // Ask the staff tool (the tab that opened this scanner) to open the card and stamp it, and wait for its answer.
    const answer = new Promise((res) => {
      const on = (e) => { const d = e.data; if (e.source !== op || !d || d.type !== "amed-scan-result" || d.rid !== rid) return; window.removeEventListener("message", on); res(d); };
      window.addEventListener("message", on); setTimeout(() => { window.removeEventListener("message", on); res(null); }, 8000);
    });
    try { op.postMessage({ type: "amed-scan", code, p, rid }, STAFF_ORIGIN); } catch (_) {}
    try { op.postMessage({ type: "amed-scan", code, p, rid }, "*"); } catch (_) {}
    const d = await answer;
    if (!d) { showResult("warn", "", tr("noAnswer"), ""); nextCustomer(5000); return; }
    const stamped = typeof d.topic === "string" && /^amed-[0-9a-f]{32}$/.test(d.topic) && d.ev;
    const name = typeof d.name === "string" ? d.name.slice(0, 60) : "", note = typeof d.note === "string" ? d.note.slice(0, 200) : "", line = typeof d.line === "string" ? d.line.slice(0, 80) : "";
    showResult(stamped ? "ok" : "warn", name, note, line);
    msg(stamped ? tr("stamped") : "", "ok");
    // Tell the customer's phone at once (no name, phone or PIN in the message).
    if (stamped) { try { fetch(LIVE_HOST + "/", { method: "POST", keepalive: true, body: JSON.stringify({ topic: d.topic, message: JSON.stringify(d.ev) }) }).catch(() => {}); } catch (_) {} }
    nextCustomer(stamped ? 3500 : 5000);
  }
  function loop() {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      if (done || !stream) return;
      const v = $("video");
      if (v.readyState >= 2) {
        const raw = await decode(v);
        if (raw !== null && !done && !(raw === lastRaw && Date.now() - lastRawAt < 15000)) { const code = codeFrom(raw); if (code) return found(code, raw); msg(tr("notMember"), "err"); }
      }
      loop();
    }, 180);
  }
  async function start() {
    stop(); done = false; $("frame").classList.remove("ok"); msg(tr("allow"));
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg(tr("noCam"), "err"); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
    catch (e) { msg(e && e.name === "NotFoundError" ? tr("noCam") : tr("denied"), "err"); return; }
    const v = $("video"); v.srcObject = stream; try { await v.play(); } catch (_) {}
    msg(tr("point")); getDetector(); loop();
    try { const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput").length; $("switch").hidden = cams < 2; } catch (_) {}
  }
  $("switch").addEventListener("click", () => { facing = facing === "environment" ? "user" : "environment"; try { localStorage.setItem("amed-scan-facing", facing); } catch (_) {} start(); });
  $("close").addEventListener("click", () => { stop(); try { window.close(); } catch (_) {} setTimeout(() => history.length > 1 ? history.back() : null, 200); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else if (!done) start(); });
  const linked = () => !!(window.opener && !window.opener.closed);
  function linkCheck() { if (!linked()) { showResult("warn", "", tr("noLink"), ""); $("res").dataset.link = "1"; } else if ($("res").dataset.link) { delete $("res").dataset.link; $("res").hidden = true; } }
  setInterval(() => { if (!done) linkCheck(); }, 3000);
  start(); linkCheck();
})();
</script>
</body>
</html>
