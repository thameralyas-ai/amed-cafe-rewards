<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14110E">
<title>Amed Cafe – Card scanner</title>
<style>
  :root { --bg: #14110E; --ink: #F3EADF; --muted: #B9AC9C; --accent: #C8925F; --line: #3A322B; --danger: #FF8A7A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
  header img { height: 34px; width: auto; filter: invert(1); }
  header h1 { margin: 0; font-size: 1rem; font-weight: 700; color: var(--muted); }
  .view { position: relative; overflow: hidden; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; left: 50%; top: 50%; width: min(70vw, 52vh, 420px); aspect-ratio: 1; transform: translate(-50%, -50%); border: 4px solid #fff; border-radius: 22px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); transition: border-color .15s; }
  .frame.ok { border-color: #5BD38A; }
  footer { display: grid; gap: 12px; padding: 14px 16px 18px; }
  #msg { margin: 0; text-align: center; font-size: 1.05rem; min-height: 1.5em; }
  #msg.err { color: var(--danger); font-weight: 600; }
  #msg.ok { color: #5BD38A; font-weight: 700; font-size: 1.2rem; }
  .btns { display: flex; gap: 10px; }
  button, .btn { flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: #221D18; color: var(--ink); font: 600 1rem inherit; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 0 14px; }
  .primary { background: var(--accent); border-color: var(--accent); color: #1B130C; }
  .res { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 2; display: grid; gap: 6px; padding: 18px 20px; border-radius: 20px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.5); animation: resIn .35s cubic-bezier(.2,1.4,.4,1); }
  .res.ok { background: #1F6B43; color: #fff; }
  .res.warn { background: #8A5A12; color: #fff; }
  .res b { font-size: 1.6rem; line-height: 1.2; }
  .res span { font-size: 1.15rem; }
  #resLine { font-size: 1.35rem; font-weight: 800; letter-spacing: .02em; }
  @keyframes resIn { from { transform: translateY(30px) scale(.9); opacity: 0; } }
  .hd { display: grid; justify-items: end; gap: 2px; }
  #link { font-size: .85rem; font-weight: 700; }
  #link.ok { color: #5BD38A; } #link.err { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><img src="/logo.png" alt="Amed Cafe"><div class="hd"><h1 id="title">Card scanner</h1><span id="link"></span></div></header>
<div class="view"><video id="video" playsinline muted autoplay></video><div class="frame" id="frame" aria-hidden="true"></div>
  <div class="res" id="res" role="status" hidden><b id="resName"></b><span id="resNote"></span><span id="resLine"></span></div></div>
<footer>
  <p id="msg" role="status"></p>
  <div class="btns">
    <button type="button" id="switch">Switch camera</button>
    <button type="button" id="close">Close</button>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" async></script>
<script>
(() => {
  // The staff tool runs on this same website, so scans are only ever sent to (and answers only accepted from)
  // this origin. The old claude.ai origin, the "*" wildcard and the public ntfy.sh relay were removed: they could
  // hand member codes to any page that opened the scanner, or to anyone watching the relay topic.
  const STAFF_ORIGIN = location.origin, LIVE_HOST = "https://ntfy.sh";
  const T = {
    en: { linkOk: "✓ Connected to the staff tool", linkNo: "✗ Not connected", noAnswer: "The staff tool isn't answering. Keep the staff tool open in its own tab (refresh it once), then come back here.", k_stamped: "Stamp added ✓", k_won: "Reward earned! 🎁", k_opened: "Card opened in the staff tool", k_ready: "A free reward is waiting — give it first. Not stamped.", k_dup: "Already stamped a moment ago. Not stamped again.", k_notenrolled: "Not on this card. Not stamped.", k_unknown: "No member has this code.", k_notmember: "Not an Amed Cafe member card.", k_notstamped: "Not stamped — check the staff tool (opening hours or daily limit).", title: "Card scanner", point: "Point the camera at the QR code on the customer's phone.", allow: "Allow the camera so the scanner can read the code.", denied: "The camera is blocked. In the browser, tap the lock icon next to the address (or open Settings → Site settings → Camera), allow the camera for amedcaferest.com, then reload.", notMember: "This QR code is not an Amed Cafe member card.", found: "Card found: {code}", stamped: "Done ✓ — ready for the next customer", noLink: "Not connected to the staff tool. Close this tab, go to the staff tool tab and tap Scan there.", backHint: "Go back to the staff tool tab — the card is open there.", openCard: "Open card", sw: "Switch camera", close: "Close", noCam: "No camera found on this device." },
    ar: { linkOk: "✓ متصل بأداة الموظفين", linkNo: "✗ غير متصل", noAnswer: "أداة الموظفين لا تستجيب. أبقِها مفتوحة في تبويبها (حدّثها مرة واحدة)، ثم عد إلى هنا.", k_stamped: "تمت إضافة الختم ✓", k_won: "ربح مكافأة! 🎁", k_opened: "فُتحت البطاقة في أداة الموظفين", k_ready: "لديه مكافأة مجانية جاهزة — قدّمها أولاً. لم يُضف ختم.", k_dup: "تم الختم قبل لحظات. لم يُضف ختم آخر.", k_notenrolled: "غير مسجّل في هذه البطاقة. لم يُضف ختم.", k_unknown: "لا يوجد عضو بهذا الرمز.", k_notmember: "ليست بطاقة عضوية لمقهى أميد.", k_notstamped: "لم يُضف ختم — راجع أداة الموظفين (ساعات العمل أو الحد اليومي).", title: "ماسح البطاقات", point: "وجّه الكاميرا نحو رمز QR على هاتف الزبون.", allow: "اسمح باستخدام الكاميرا ليقرأ الماسح الرمز.", denied: "الكاميرا محظورة. في المتصفح اضغط على رمز القفل بجانب العنوان (أو الإعدادات ← إعدادات المواقع ← الكاميرا)، واسمح بالكاميرا لموقع amedcaferest.com، ثم أعد التحميل.", notMember: "هذا الرمز ليس بطاقة عضوية لمقهى أميد.", found: "تم العثور على البطاقة: {code}", stamped: "تم ✓ — جاهز للزبون التالي", noLink: "غير متصل بأداة الموظفين. أغلق هذا التبويب، واذهب إلى تبويب أداة الموظفين واضغط «مسح» من هناك.", backHint: "ارجع إلى تبويب أداة الموظفين — البطاقة مفتوحة هناك.", openCard: "افتح البطاقة", sw: "تبديل الكاميرا", close: "إغلاق", noCam: "لا توجد كاميرا في هذا الجهاز." },
    ku: { linkOk: "✓ ب ئامرازێ کارمەندان ڤە گرێدایە", linkNo: "✗ نەگرێدایە", noAnswer: "ئامرازێ کارمەندان بەرسڤێ نادەت. د تابا خۆ دا ڤەکری بهێلە (جارەکێ نوو بکە)، پاشان بزڤڕە ڤێرێ.", k_stamped: "مۆر هاتە زێدەکرن ✓", k_won: "خەلاتەک بدەستڤە ئینا! 🎁", k_opened: "کارت د ئامرازێ کارمەندان دا ڤەبوو", k_ready: "خەلاتەکێ بێ بەرامبەر یێ ئامادەیە — دەستپێکێ وێ بدە. مۆر نەهاتە لێدان.", k_dup: "بەری کێمەکێ مۆر هاتە لێدان. دووبارە نەهاتە لێدان.", k_notenrolled: "ل سەر ڤێ کارتێ نینە. مۆر نەهاتە لێدان.", k_unknown: "چ ئەندام ڤی کۆدی نینە.", k_notmember: "نە کارتا ئەندامێتیا ئامێد کافێیە.", k_notstamped: "مۆر نەهاتە لێدان — ئامرازێ کارمەندان ببینە (دەمێن کارکرنێ یان سنوورێ ڕۆژانە).", title: "سکانەرێ کارتان", point: "کامێرایێ بەرەڤ کۆدێ QR ل سەر مۆبایلا کڕیاری بگرە.", allow: "ڕێ بدە کامێرایێ دا سکانەر کۆدی بخوینیت.", denied: "کامێرا هاتیە ڕاگرتن. د وێبگەڕی دا ل سەر نیشانا قفلێ ل تەنیشت ناڤنیشانی بدە (یان ڕێکخستن ← ڕێکخستنێن ماڵپەڕی ← کامێرا)، ڕێ بدە کامێرایێ بۆ amedcaferest.com، پاشان پەڕێ نوو بکە.", notMember: "ئەڤ کۆدە نە کارتا ئەندامێتیا ئامێد کافێیە.", found: "کارت هاتە دیتن: {code}", stamped: "تمام ✓ — بۆ کڕیارێ دی ئامادەیە", noLink: "ب ئامرازێ کارمەندان ڤە نەگرێدایە. ڤێ تابێ دابخە، بچە تابا ئامرازێ کارمەندان و ژ وێرێ «سکان» بکە.", backHint: "بزڤڕە تابا ئامرازێ کارمەندان — کارت ل وێرێ ڤەبوویە.", openCard: "کارتێ ڤەکە", sw: "کامێرایێ بگوهۆڕە", close: "دابخە", noCam: "چ کامێرا ل سەر ڤێ ئامیرێ نینە." }
  };
  const qs = new URLSearchParams(location.search);
  const lang = T[qs.get("lang")] ? qs.get("lang") : "en";
  const tr = (k, v) => T[lang][k].replace(/\{(\w+)\}/g, (m, x) => (v && x in v ? v[x] : m));
  document.documentElement.lang = lang === "ku" ? "ckb" : lang;
  document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
  const $ = (id) => document.getElementById(id);
  $("title").textContent = tr("title"); $("switch").textContent = tr("sw"); $("close").textContent = tr("close");
  const msg = (text, cls) => { $("msg").textContent = text; $("msg").className = cls || ""; };

  let stream = null, timer = 0, done = false, detector, facing = "environment";
  try { facing = localStorage.getItem("amed-scan-facing") || "environment"; } catch (_) {}
  const progFrom = (s) => { const m = String(s).match(/#m-[A-Z0-9]{6}\.([a-z]{2,20})\b/i); return m ? m[1].toLowerCase() : null; };
  const codeFrom = (s) => { const m = String(s).match(/#m-([A-Z0-9]{6})\b/i) || String(s).trim().match(/^([A-Z0-9]{6})$/i); return m ? m[1].toUpperCase() : null; };

  async function getDetector() {
    if (detector !== undefined) return detector;
    detector = null;
    try { if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("qr_code")) detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (_) {}
    return detector;
  }
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
  async function decode(v) {
    const d = await getDetector();
    if (d) { try { const r = await d.detect(v); if (r.length) return r[0].rawValue; } catch (_) {} }
    if (!window.jsQR || !v.videoWidth) return null;
    const k = Math.min(1, 900 / Math.max(v.videoWidth, v.videoHeight));
    cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k);
    cx.drawImage(v, 0, 0, cv.width, cv.height);
    const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: "attemptBoth" });
    return r ? r.data : null;
  }
  function stop() { clearTimeout(timer); if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; }

  // Continuous counter scanner: after each card it shows the result for a few seconds, then scans the next one by itself.
  let lastRaw = "", lastRawAt = 0, resTimer = 0;
  function showResult(kind, name, note, line) {
    const r = $("res"); r.className = "res " + kind; $("resName").textContent = name || ""; $("resNote").textContent = note || ""; $("resLine").textContent = line || "";
    $("resName").hidden = !name; $("resLine").hidden = !line; r.hidden = false;
  }
  function nextCustomer(ms) {
    clearTimeout(resTimer);
    resTimer = setTimeout(() => { $("res").hidden = true; $("frame").classList.remove("ok"); done = false; msg(tr("point")); if (stream) loop(); else start(); }, ms);
  }
  // Link to the staff tool. Inside Claude the staff tool can't keep a tab link, so scans travel through ntfy.sh on a
  // private topic made from a random counter key (k) that only this tablet knows. Only codes and counts are sent.
  const K = "";   // relay retired (see STAFF_ORIGIN); the ?k= parameter is ignored
  const waits = new Map(); let relayEs = null, relayOk = false, pongAt = 0;
  function relayListen() {
    if (!K || relayEs || !window.EventSource) return;
    relayEs = new EventSource(LIVE_HOST + "/amed-scanres-" + K + "/sse");
    relayEs.onopen = () => { relayOk = true; };
    relayEs.onerror = () => { relayOk = false; };
    relayEs.onmessage = (m) => {
      try { const d = JSON.parse(m.data); if (d.event !== "message") return; const r = JSON.parse(d.message);
        if (!r || r.type !== "amed-scan-result") return; if (r.kind === "pong") pongAt = Date.now();
        const w = waits.get(r.rid); if (w) { waits.delete(r.rid); w(r); } } catch (_) {}
    };
  }
  function relaySend(obj) { return fetch(LIVE_HOST + "/", { method: "POST", body: JSON.stringify({ topic: "amed-scan-" + K, message: JSON.stringify(obj) }) }); }
  const newRid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
  // Send a request to the staff tool (tab link if there is one, else the relay) and wait for its answer.
  async function ask(req, ms) {
    const rid = newRid(); req.rid = rid; req.t = Date.now();
    const op = window.opener && !window.opener.closed ? window.opener : null;
    const answer = new Promise((res) => {
      const done1 = (d) => { window.removeEventListener("message", on); waits.delete(rid); clearTimeout(to); res(d); };
      const on = (e) => { const d = e.data; if (!op || e.source !== op || e.origin !== STAFF_ORIGIN || !d || d.type !== "amed-scan-result" || d.rid !== rid) return; done1(d); };
      window.addEventListener("message", on); waits.set(rid, done1);
      const to = setTimeout(() => done1(null), ms);
    });
    if (op) { try { op.postMessage(req, STAFF_ORIGIN); } catch (_) {} }
    if (K) { try { await relaySend(req); } catch (_) {} }
    return answer;
  }
  async function ping() {
    if (done) return;
    const d = await ask({ type: "amed-scan", ping: 1 }, 9000);
    if (done) return;
    if (d) { pongAt = Date.now(); if ($("res").dataset.link) { delete $("res").dataset.link; $("res").hidden = true; } $("link").textContent = tr("linkOk"); $("link").className = "ok"; }
    else { showResult("warn", "", K ? tr("noAnswer") : tr("noLink"), ""); $("res").dataset.link = "1"; $("link").textContent = tr("linkNo"); $("link").className = "err"; }
  }
  const KIND = { stamped: "ok", won: "ok", opened: "ok" };
  async function found(code, raw) {
    const p = progFrom(raw);
    done = true; clearTimeout(timer); lastRaw = raw; lastRawAt = Date.now(); $("frame").classList.add("ok");
    try { navigator.vibrate && navigator.vibrate(90); } catch (_) {}
    msg(tr("found", { code }), "ok");
    if (!K && !(window.opener && !window.opener.closed)) { showResult("warn", "", tr("noLink"), ""); nextCustomer(5000); return; }
    const d = await ask({ type: "amed-scan", code, p }, 12000);
    if (!d) { showResult("warn", "", tr("noAnswer"), ""); nextCustomer(5000); return; }
    pongAt = Date.now();
    const stamped = typeof d.topic === "string" && /^amed-[0-9a-f]{32}$/.test(d.topic) && d.ev;
    const kind = typeof d.kind === "string" && T[lang]["k_" + d.kind] ? d.kind : (stamped ? "stamped" : "opened");
    const name = typeof d.name === "string" ? d.name.slice(0, 60) : "", line = typeof d.line === "string" ? d.line.slice(0, 80) : "";
    showResult(KIND[kind] || "warn", name || code, tr("k_" + kind), line);
    msg(stamped ? tr("stamped") : "", "ok");
    // Tell the customer's phone at once (no name, phone or PIN in the message).
    if (stamped) { try { fetch(LIVE_HOST + "/", { method: "POST", keepalive: true, body: JSON.stringify({ topic: d.topic, message: JSON.stringify(d.ev) }) }).catch(() => {}); } catch (_) {} }
    nextCustomer(KIND[kind] ? 3500 : 5500);
  }
  function loop() {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      if (done || !stream) return;
      const v = $("video");
      if (v.readyState >= 2) {
        const raw = await decode(v);
        if (raw !== null && !done && !(raw === lastRaw && Date.now() - lastRawAt < 15000)) { const code = codeFrom(raw); if (code) return found(code, raw); msg(tr("notMember"), "err"); }
      }
      loop();
    }, 180);
  }
  async function start() {
    stop(); done = false; $("frame").classList.remove("ok"); msg(tr("allow"));
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg(tr("noCam"), "err"); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
    catch (e) { msg(e && e.name === "NotFoundError" ? tr("noCam") : tr("denied"), "err"); return; }
    const v = $("video"); v.srcObject = stream; try { await v.play(); } catch (_) {}
    msg(tr("point")); getDetector(); loop();
    try { const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput").length; $("switch").hidden = cams < 2; } catch (_) {}
  }
  $("switch").addEventListener("click", () => { facing = facing === "environment" ? "user" : "environment"; try { localStorage.setItem("amed-scan-facing", facing); } catch (_) {} start(); });
  $("close").addEventListener("click", () => { stop(); try { window.close(); } catch (_) {} setTimeout(() => history.length > 1 ? history.back() : null, 200); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else if (!done) start(); });
  relayListen(); start();
  setTimeout(ping, 1500);
  setInterval(() => { if (!done && Date.now() - pongAt > 110000) ping(); }, 120000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - pongAt > 30000) setTimeout(ping, 800); });
})();
</script>
</body>
</html>
