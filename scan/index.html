<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14110E">
<title>Amed Cafe – Card scanner</title>
<style>
  :root { --bg: #14110E; --ink: #F3EADF; --muted: #B9AC9C; --accent: #C8925F; --line: #3A322B; --danger: #FF8A7A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
  header img { height: 34px; width: auto; filter: invert(1); }
  header h1 { margin: 0; font-size: 1rem; font-weight: 700; color: var(--muted); }
  .view { position: relative; overflow: hidden; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; left: 50%; top: 50%; width: min(70vw, 52vh, 420px); aspect-ratio: 1; transform: translate(-50%, -50%); border: 4px solid #fff; border-radius: 22px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); transition: border-color .15s; }
  .frame.ok { border-color: #5BD38A; }
  footer { display: grid; gap: 12px; padding: 14px 16px 18px; }
  #msg { margin: 0; text-align: center; font-size: 1.05rem; min-height: 1.5em; }
  #msg.err { color: var(--danger); font-weight: 600; }
  #msg.ok { color: #5BD38A; font-weight: 700; font-size: 1.2rem; }
  .btns { display: flex; gap: 10px; }
  button, .btn { flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: #221D18; color: var(--ink); font: 600 1rem inherit; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 0 14px; }
  .primary { background: var(--accent); border-color: var(--accent); color: #1B130C; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><img src="/logo.png" alt="Amed Cafe"><h1 id="title">Card scanner</h1></header>
<div class="view"><video id="video" playsinline muted autoplay></video><div class="frame" id="frame" aria-hidden="true"></div></div>
<footer>
  <p id="msg" role="status"></p>
  <div class="btns">
    <a class="btn primary" id="back" hidden>Open card</a>
    <button type="button" id="switch">Switch camera</button>
    <button type="button" id="close">Close</button>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" async></script>
<script>
(() => {
  const STAFF_ORIGIN = "https://claude.ai";
  const T = {
    en: { title: "Card scanner", point: "Point the camera at the QR code on the customer's phone.", allow: "Allow the camera so the scanner can read the code.", denied: "The camera is blocked. In the browser, tap the lock icon next to the address (or open Settings → Site settings → Camera), allow the camera for amedcaferest.com, then reload.", notMember: "This QR code is not an Amed Cafe member card.", found: "Card found: {code}", backHint: "Go back to the staff tool tab — the card is open there.", openCard: "Open card", sw: "Switch camera", close: "Close", noCam: "No camera found on this device." },
    ar: { title: "ماسح البطاقات", point: "وجّه الكاميرا نحو رمز QR على هاتف الزبون.", allow: "اسمح باستخدام الكاميرا ليقرأ الماسح الرمز.", denied: "الكاميرا محظورة. في المتصفح اضغط على رمز القفل بجانب العنوان (أو الإعدادات ← إعدادات المواقع ← الكاميرا)، واسمح بالكاميرا لموقع amedcaferest.com، ثم أعد التحميل.", notMember: "هذا الرمز ليس بطاقة عضوية لمقهى أميد.", found: "تم العثور على البطاقة: {code}", backHint: "ارجع إلى تبويب أداة الموظفين — البطاقة مفتوحة هناك.", openCard: "افتح البطاقة", sw: "تبديل الكاميرا", close: "إغلاق", noCam: "لا توجد كاميرا في هذا الجهاز." },
    ku: { title: "سکانەرێ کارتان", point: "کامێرایێ بەرەڤ کۆدێ QR ل سەر مۆبایلا کڕیاری بگرە.", allow: "ڕێ بدە کامێرایێ دا سکانەر کۆدی بخوینیت.", denied: "کامێرا هاتیە ڕاگرتن. د وێبگەڕی دا ل سەر نیشانا قفلێ ل تەنیشت ناڤنیشانی بدە (یان ڕێکخستن ← ڕێکخستنێن ماڵپەڕی ← کامێرا)، ڕێ بدە کامێرایێ بۆ amedcaferest.com، پاشان پەڕێ نوو بکە.", notMember: "ئەڤ کۆدە نە کارتا ئەندامێتیا ئامێد کافێیە.", found: "کارت هاتە دیتن: {code}", backHint: "بزڤڕە تابا ئامرازێ کارمەندان — کارت ل وێرێ ڤەبوویە.", openCard: "کارتێ ڤەکە", sw: "کامێرایێ بگوهۆڕە", close: "دابخە", noCam: "چ کامێرا ل سەر ڤێ ئامیرێ نینە." }
  };
  const qs = new URLSearchParams(location.search);
  const lang = T[qs.get("lang")] ? qs.get("lang") : "en";
  const tr = (k, v) => T[lang][k].replace(/\{(\w+)\}/g, (m, x) => (v && x in v ? v[x] : m));
  document.documentElement.lang = lang === "ku" ? "ckb" : lang;
  document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
  const $ = (id) => document.getElementById(id);
  $("title").textContent = tr("title"); $("switch").textContent = tr("sw"); $("close").textContent = tr("close"); $("back").textContent = tr("openCard");
  const msg = (text, cls) => { $("msg").textContent = text; $("msg").className = cls || ""; };

  let stream = null, timer = 0, done = false, detector, facing = "environment";
  try { facing = localStorage.getItem("amed-scan-facing") || "environment"; } catch (_) {}
  const progFrom = (s) => { const m = String(s).match(/#m-[A-Z0-9]{6}\.([a-z]{2,20})\b/i); return m ? m[1].toLowerCase() : null; };
  const codeFrom = (s) => { const m = String(s).match(/#m-([A-Z0-9]{6})\b/i) || String(s).trim().match(/^([A-Z0-9]{6})$/i); return m ? m[1].toUpperCase() : null; };

  async function getDetector() {
    if (detector !== undefined) return detector;
    detector = null;
    try { if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("qr_code")) detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (_) {}
    return detector;
  }
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
  async function decode(v) {
    const d = await getDetector();
    if (d) { try { const r = await d.detect(v); if (r.length) return r[0].rawValue; } catch (_) {} }
    if (!window.jsQR || !v.videoWidth) return null;
    const k = Math.min(1, 900 / Math.max(v.videoWidth, v.videoHeight));
    cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k);
    cx.drawImage(v, 0, 0, cv.width, cv.height);
    const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: "attemptBoth" });
    return r ? r.data : null;
  }
  function stop() { clearTimeout(timer); if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; }

  async function found(code, raw) {
    const p = progFrom(raw);
    done = true; stop(); $("frame").classList.add("ok");
    try { navigator.vibrate && navigator.vibrate(90); } catch (_) {}
    msg(tr("found", { code }), "ok");
    let link = "";
    try { const d = await (await fetch("/data.json", { cache: "no-store" })).json(); if (d && d.staffLink) link = d.staffLink + "#m-" + code + (p ? "." + p : ""); } catch (_) {}
    if (!link && /^https:\/\/claude\.ai\//.test(raw)) link = raw;
    if (window.opener && !window.opener.closed) {
      try { window.opener.postMessage({ type: "amed-scan", code, p }, STAFF_ORIGIN); } catch (_) {}
      try { window.opener.postMessage({ type: "amed-scan", code, p }, "*"); } catch (_) {}
      setTimeout(() => { try { window.close(); } catch (_) {} }, 350);
      setTimeout(() => { msg(tr("backHint"), "ok"); if (link) { $("back").href = link; $("back").hidden = false; } }, 1200);
    } else {
      msg(tr("backHint"), "ok");
      if (link) { $("back").href = link; $("back").hidden = false; }
    }
  }
  function loop() {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      if (done || !stream) return;
      const v = $("video");
      if (v.readyState >= 2) {
        const raw = await decode(v);
        if (raw !== null && !done) { const code = codeFrom(raw); if (code) return found(code, raw); msg(tr("notMember"), "err"); }
      }
      loop();
    }, 180);
  }
  async function start() {
    stop(); done = false; $("frame").classList.remove("ok"); $("back").hidden = true; msg(tr("allow"));
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg(tr("noCam"), "err"); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
    catch (e) { msg(e && e.name === "NotFoundError" ? tr("noCam") : tr("denied"), "err"); return; }
    const v = $("video"); v.srcObject = stream; try { await v.play(); } catch (_) {}
    msg(tr("point")); getDetector(); loop();
    try { const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput").length; $("switch").hidden = cams < 2; } catch (_) {}
  }
  $("switch").addEventListener("click", () => { facing = facing === "environment" ? "user" : "environment"; try { localStorage.setItem("amed-scan-facing", facing); } catch (_) {} start(); });
  $("close").addEventListener("click", () => { stop(); try { window.close(); } catch (_) {} setTimeout(() => history.length > 1 ? history.back() : null, 200); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else if (!done) start(); });
  start();
})();
</script>
</body>
</html>
